<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>はまこく Map｜横浜国大のシェアサイクル</title>
  <!-- 共有されたときの見え方（#126）。og:image と og:url は絶対 URL でないと読まれない。
       このページは file:// でも開ける静的ページなので、本番のドメインを直に書いている。
       app_v1 側は config/site.js の SITE_ORIGIN で差し替えられる（公開先が変わったら両方直す） -->
  <meta name="description" content="横浜国立大学構内とその周辺のシェアサイクルポートを地図で見られます。HELLO CYCLING とドコモ・バイクシェアの、いま借りられる台数を事業者ごとに表示します。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="team 301">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="はまこく Map｜横浜国大のシェアサイクル">
  <meta property="og:description" content="横浜国立大学構内とその周辺のシェアサイクルポートを地図で見られます。HELLO CYCLING とドコモ・バイクシェアの、いま借りられる台数を事業者ごとに表示します。">
  <meta name="twitter:title" content="はまこく Map｜横浜国大のシェアサイクル">
  <meta name="twitter:description" content="横浜国立大学構内とその周辺のシェアサイクルポートを地図で見られます。いま借りられる台数を事業者ごとに表示します。">
  <!-- アイコン（#127）。元データは brand/hamakoku/。ロゴは確定（別案が出たら #169） -->
  <link rel="icon" href="icons/favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="icons/manifest.webmanifest">
  <!-- 書体は はまこく Exp. と同じ（ADR-0017）。読めなくても下の代わりの書体で出る -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=BIZ+UDPGothic:wght@400;700&display=swap">
  <style>
    /* ========================================================================
       見た目は はまこく Exp. にそろえる（#177、案A 構内案内図）。
       色・罫線は ADR-0011（白い紙に青インクの2色刷り。赤は遅れ・満・選んでいるものだけ）、
       書体は ADR-0017（13px 以上は明朝、12px 以下はゴシック）、夜の紙は ADR-0022。
       値は app_v1/public/css/styles.css のトークンと同じにしてある（テストで確かめている）
       ======================================================================== */
    :root {
      --ink: #1F4E9C;
      --red: #C8322B;
      --muted: #5B6B85;
      --field-bg: #EEF3FB;
      --paper: #FFFFFF;
      --on-ink: #FFFFFF;
      --selected-bg: #DCE7F7;
      --rule-weak-color: #A9B8D0;
      --tint-color: rgba(31, 78, 156, 0.07);
      /* はまこく Exp. の出発地の建物の塗り。選んだら濃くする */
      --dep-fill: rgba(31, 78, 156, 0.14);
      --dep-fill-on: rgba(31, 78, 156, 0.34);
      /* 事業者の色。Exp. の案内券と同じく、台数のチップにだけ使う */
      --hello: #F5B400;
      --hello-fg: #221A00;
      --docomo: #D8232A;
      --docomo-fg: #FFFFFF;
      --zero: #D9DEE6;
      --zero-fg: #4A5568;
      /* 下地の地図（OSM から描いた SVG）は彩度を落として、上に重ねる青を立たせる。
         以前は彩度を完全に落としていたが、それだと川と大きな道路が同じ灰色になり、
         SVG 側でどれだけ色を分けても見分けられなかったので、色味は残す（#184） */
      /* 走っているバスは、ポートやバス停より一段下げた灰色にする（#184）。
         横浜駅のまわりは台数が多く、青のままだと主役のポートと競る */
      --bus-muted: #949CA8;
      /* 駅の出口（#192）。国大の地図に描いてある門（drawArea.js の --gate）と同じ色にして、
         「出入りするところ」であることを色でそろえる（#194） */
      --gate: #4b6b3c;
      --base-opacity: 0.72;
      --base-filter: saturate(0.72) contrast(0.92) brightness(1.04);

      --font-serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --font-sans: "BIZ UDPGothic", "Hiragino Sans", "Meiryo", sans-serif;
      --tap-min: 44px;

      /* 地図の上の印の大きさ。地図を拡大縮小しても変わらない（画面の px） */
      --pin: 18px;
      --pin-font: 11px;
      --tag-h: 15px;
      --tag-font: 11px;

      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --paper: #0F1A2E;
        --ink: #CFDDF5;
        --on-ink: #0F1A2E;
        --red: #FF7A6B;
        --muted: #8E9DB8;
        --field-bg: #1C2B45;
        --selected-bg: #22375A;
        --rule-weak-color: #3A4B69;
        --tint-color: rgba(207, 221, 245, 0.06);
        --dep-fill: rgba(207, 221, 245, 0.16);
        --dep-fill-on: rgba(207, 221, 245, 0.36);
        --zero: #3A4B69;
        --zero-fg: #CFDDF5;
        --bus-muted: #79828F;
        --gate: #b9d8a6;
        --base-opacity: 0.74;
        --base-filter: saturate(0.78) contrast(0.95) brightness(1.02);
      }
    }
    @media (min-width: 900px) {
      :root { --pin: 22px; --pin-font: 12px; --tag-h: 17px; --tag-font: 12px; }
    }

    * { box-sizing: border-box; }
    /* display を指定した要素でも hidden が効くようにする */
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 15px;
      line-height: 1.6;
    }
    a { color: var(--ink); }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .sans { font-family: var(--font-sans); }

    .page { max-width: 1280px; margin: 0 auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px; }

    /* ---- 見出し ---- */
    .masthead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 16px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
    .masthead h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 0.1em; line-height: 1.3; }
    /* 狭い画面ではロゴと時計が2段になるので、どちらも中央にそろえる */
    @media (max-width: 599px) {
      .masthead { justify-content: center; }
      .masthead .clock { justify-content: center; width: 100%; }
    }
    /* ワードマーク（ロゴ H2-3）。横長なので幅で決める */
    .masthead h1 .wordmark { display: block; width: min(300px, 80vw); height: auto; }
    .masthead h1 .wordmark.dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .masthead h1 .wordmark.light { display: none; }
      .masthead h1 .wordmark.dark { display: block; }
    }
    .clock { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-family: var(--font-sans); font-size: 12px; }
    .clock .warn { color: var(--muted); }
    .btn {
      min-height: 36px; padding: 0 12px; border: 1px solid var(--ink); background: var(--paper);
      color: var(--ink); font-family: var(--font-sans); font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .btn:disabled { opacity: 0.55; cursor: default; }

    /* ---- 地図と右（スマホは下）の欄 ---- */
    .layout { display: flex; flex-direction: column; gap: 16px; }
    .map-col { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .side { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    @media (min-width: 900px) {
      .layout { flex-direction: row; align-items: flex-start; }
      .map-col { flex: 0 0 60%; }
      .side { flex: 1 1 0; }
    }

    /* 地図（#174 の作りを引き継ぐ）: 枠（.map-viewport）の中で、下地の SVG と建物の層を重ねた
       .map-canvas を transform で拡大縮小・移動する。ピン・バス停・バスは .map-markers に置き、
       位置だけを地図に合わせて動かす（大きさは変えない。スマホの全体表示でも読める） */
    .map-frame { position: relative; }
    .map-viewport {
      position: relative; width: 100%; overflow: hidden;
      border: 2px solid var(--ink); background: var(--paper);
      touch-action: none; cursor: grab; overscroll-behavior: contain;
    }
    .map-viewport.dragging { cursor: grabbing; }
    .map-canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    .map-canvas > object, .map-canvas > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .map-canvas > object { pointer-events: none; filter: var(--base-filter); opacity: var(--base-opacity); }
    .map-canvas > svg { pointer-events: none; overflow: visible; }
    .map-markers { position: absolute; inset: 0; pointer-events: none; }
    .map-markers > * { position: absolute; left: 0; top: 0; pointer-events: auto; }

    /* 層の表示切り替え（#174）。「地図に出す」で種類ごとに消す */
    .map-viewport.hide-ports .pin { display: none; }
    .map-viewport.hide-stops .stop { display: none; }
    .map-viewport.hide-buses .bus { display: none; }
    .map-viewport.hide-stations .station { display: none; }
    .map-viewport.hide-exits .exit { display: none; }

    /* はまこく Exp. の出発地の建物（#179）。地図と一緒に拡大縮小する */
    .dep { fill: var(--dep-fill); stroke: var(--ink); stroke-width: 1; stroke-opacity: 0.7; vector-effect: non-scaling-stroke; pointer-events: auto; cursor: pointer; }
    .dep.on { fill: var(--dep-fill-on); }
    .dep:focus { outline: none; }
    .dep:focus-visible { stroke-width: 3; stroke-opacity: 1; }
    .dep-label { width: 0; height: 0; pointer-events: none !important; }
    .dep-label span {
      position: absolute; left: 0; bottom: 1px; transform: translateX(-50%); white-space: nowrap;
      font-family: var(--font-sans); font-size: 10px; color: var(--ink);
      text-shadow: 0 0 2px var(--paper), 0 0 2px var(--paper), 0 0 2px var(--paper);
    }
    .dep-callout {
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      padding: 8px 30px 8px 10px; background: var(--paper); border: 2px solid var(--ink);
      box-shadow: 0 2px 0 rgba(14, 30, 58, 0.15); z-index: 5;
    }
    .dep-callout b { font-family: var(--font-sans); font-size: 11px; }
    .dep-callout a {
      display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px; background: var(--ink); color: var(--on-ink);
      font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap;
    }
    .dep-callout .x { position: absolute; top: 0; right: 0; width: 28px; height: 28px; border: 0; background: none; font-size: 15px; cursor: pointer; }

    /* ポート（番号の丸 ＋ 自転車のマークと台数）。名前は一覧に回す */
    .pin { width: 0; height: 0; z-index: 3; }
    .pin-num {
      position: absolute; left: calc(var(--pin) / -2); top: calc(var(--pin) / -2);
      width: var(--pin); height: var(--pin); border-radius: 50%; background: var(--ink); color: var(--on-ink);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-sans); font-size: var(--pin-font); font-weight: 700; box-shadow: 0 0 0 2px var(--paper);
    }
    /* はまこく Exp. のルート検索が返却先に使うポートは、番号の丸に輪を足す */
    .pin.key .pin-num { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
    .pin-tag {
      position: absolute; top: calc(var(--tag-h) / -2 - 2px); display: flex; align-items: center; gap: 2px;
      background: var(--paper); border: 1px solid var(--ink); border-radius: 3px; padding: 1px 1px 1px 2px; white-space: nowrap;
    }
    .pin-tag svg { display: block; }
    .pin-tag .what { font-family: var(--font-sans); font-size: 10px; padding: 0 1px; }
    .pin.active .pin-num, .pin:hover .pin-num { background: var(--red); }
    .chip {
      height: var(--tag-h); line-height: var(--tag-h); padding: 0 3px; border-radius: 2px; display: inline-flex; align-items: baseline;
      font-family: var(--font-sans); font-size: var(--tag-font); font-weight: 700; white-space: nowrap;
    }
    .chip small { font-size: 0.75em; margin-left: 1px; }
    .chip.hellocycling { background: var(--hello); color: var(--hello-fg); }
    .chip.docomo { background: var(--docomo); color: var(--docomo-fg); }
    .chip.zero { background: var(--zero); color: var(--zero-fg); }
    /* 返せる空きの札。数字は HELLO CYCLING の値ひとつなので、塗りは全ポート同じにして、
       どの事業者で返せるかは数字の横の小さな印で示す。札ごと色を変えると、
       ドコモにしか無いポートだけが赤く目立ってしまうため（#184） */
    .chip.plain { color: var(--ink); }
    .ops { display: inline-flex; gap: 2px; margin-left: 4px; align-self: center; }
    .ops i { display: block; width: 8px; height: 8px; border-radius: 2px; }
    .ops .hellocycling { background: var(--hello); }
    .ops .docomo { background: var(--docomo); }
    .chip.na { background: transparent; color: var(--muted); border: 1px dashed var(--muted); line-height: calc(var(--tag-h) - 2px); }
    .pin-lead { position: absolute; height: 1px; background: var(--ink); transform-origin: 0 0; opacity: 0.7; }

    /* バス停（丸い標識とポール）。押すと横浜駅方面の発車時刻（#53） */
    .stop {
      width: 28px; height: 28px; margin: -14px 0 0 -14px; padding: 0; border: 0; background: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; z-index: 2; color: var(--ink);
    }
    .stop svg { overflow: visible; filter: drop-shadow(0 0 1px var(--paper)) drop-shadow(0 0 1px var(--paper)); }
    .stop .name {
      position: absolute; left: 24px; top: 50%; transform: translateY(-50%); white-space: nowrap; padding: 0 3px;
      background: color-mix(in srgb, var(--paper) 85%, transparent); font-family: var(--font-sans); font-size: 11px; font-weight: 700;
      display: none; pointer-events: none;
    }
    /* 地図の右端に近いバス停は、名前を印の下に、右をそろえて出す（#234。layoutStopNames が付ける）。
       左に出すと、すぐ左にある台数の札（構内の岡沢町では 3 の札）と重なった */
    .stop.name-left .name { left: auto; right: 0; top: calc(100% + 2px); transform: none; }
    .stop.on { color: var(--red); z-index: 4; }
    .stop.on .name, .stop:focus-visible .name { display: block; }
    @media (min-width: 900px) { .stop .name { display: block; font-size: 11px; } }

    /* 駅（#186）。横浜駅は1点に6事業者が集まるので、事業者ごとに札を置く。
       押すとその事業者の路線ごとの次の発車。印そのものは大きさ 0 で、見えているのは中の札 */
    .station { width: 0; height: 0; padding: 0; border: 0; background: none; cursor: pointer; z-index: 3; color: var(--ink); }
    /* 電車のアイコンと、その下に事業者名（#194）。塗りつぶしの札をやめ、
       ポートの番号の丸（青地に白文字）より一段引いて、シェアサイクルとバスが先に目に入るようにする */
    .station .mark {
      position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 1px; white-space: nowrap;
    }
    .station .glyph {
      width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 1px solid var(--ink);
      display: flex; align-items: center; justify-content: center; color: var(--ink);
    }
    .station .label {
      padding: 0 2px; background: color-mix(in srgb, var(--paper) 85%, transparent);
      font-family: var(--font-sans); font-size: 10px; font-weight: 700; line-height: 11px; color: var(--ink);
    }
    /* 札をずらしたときに、本当の位置との間に引く細い線 */
    .station .lead { position: absolute; left: 0; top: 0; width: 1px; background: var(--ink); opacity: 0.7; pointer-events: none; }
    .station.on { z-index: 5; }
    .station.on .glyph { background: var(--red); border-color: var(--red); color: var(--on-ink); }
    .station.on .label { color: var(--red); }

    /* 駅の出口（#192）。位置そのものが情報なので、札と違って動かさない。
       三角の先が出口の位置に当たり、線路に垂直な向きで駅のほうを指す（向きは areas.json の bearing）。
       名前は出しっぱなしにすると7つ並んで地図が埋まるので、押したときだけ出す */
    .exit { width: 0; height: 0; padding: 0; border: 0; background: none; cursor: pointer; z-index: 2; }
    .exit .tri {
      position: absolute; left: -5px; top: -8px; overflow: visible;
      transform-origin: 5px 8px;  /* 三角の先。ここを軸に回すので、回しても位置がずれない */
      filter: drop-shadow(0 0 1px var(--paper)) drop-shadow(0 0 1px var(--paper));
    }
    .exit .tri polygon { fill: var(--gate); }
    .exit .name {
      position: absolute; left: 7px; top: -4px; transform: translateY(-50%); white-space: nowrap; padding: 0 3px;
      background: color-mix(in srgb, var(--paper) 85%, transparent); font-family: var(--font-sans); font-size: 10px; font-weight: 700;
      color: var(--gate); display: none; pointer-events: none;
    }
    .exit.on { z-index: 4; }
    .exit.on .tri polygon { fill: var(--red); }
    .exit.on .name { color: var(--red); }
    .exit.on .name, .exit:focus-visible .name { display: block; }

    /* 走っているバス（#84）。丸にバスのマーク、外の小さな三角が進む向き。選んだバスは赤 */
    .bus { width: 30px; height: 30px; margin: -15px 0 0 -15px; padding: 0; border: 0; background: none; cursor: pointer; z-index: 2; color: var(--bus-muted); }
    .bus .dir { position: absolute; inset: 0; }
    .bus .body {
      position: absolute; inset: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 2px var(--paper);
      display: flex; align-items: center; justify-content: center;
    }
    .bus .route {
      position: absolute; left: 25px; top: -2px; padding: 0 3px; border: 1px solid currentColor; background: var(--paper);
      font-family: var(--font-sans); font-size: 10px; font-weight: 700; line-height: 14px; white-space: nowrap;
    }
    .bus.on { color: var(--red); z-index: 4; }

    /* 地図の下の段。凡例と、取得時刻・拡大縮小のボタン */
    .map-tools { display: flex; align-items: flex-start; gap: 8px 12px; }
    .map-tools .legend { flex: 1 1 0; min-width: 0; }
    .map-actions { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px 10px; }
    .map-zoom { flex: none; display: flex; border: 1px solid var(--ink); background: var(--paper); }
    .map-zoom button { width: 40px; height: 36px; border: 0; background: none; font-family: var(--font-sans); font-size: 16px; font-weight: 700; cursor: pointer; }
    .map-zoom button.fit { font-size: 11px; }
    .map-zoom button + button { border-left: 1px solid var(--ink); }
    /* スマホでは凡例が細くなるので、ボタンを上の段に分ける。
       取得時刻は左、拡大縮小のボタンは右に離す */
    @media (max-width: 599px) {
      .map-tools { flex-direction: column-reverse; align-items: stretch; }
      .map-actions { align-self: stretch; justify-content: flex-end; }
      /* 時刻の行は幅いっぱい（時刻は左、「今すぐ更新」は右）。つまみはその下の右に回る */
      .map-actions .clock { flex: 1 1 100%; justify-content: space-between; }
    }
    .map-zoom button:disabled { opacity: 0.35; cursor: default; }

    /* 凡例 */
    .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 0; padding: 0; list-style: none; font-family: var(--font-sans); font-size: 12px; line-height: 1.6; }
    .legend li { display: flex; align-items: center; gap: 5px; }
    .legend .swatch { display: inline-block; width: 14px; height: 10px; background: var(--dep-fill-on); outline: 1px solid var(--ink); }
    /* バスの位置が取れたかどうか（#198）。凡例の文字より一段小さく、薄く */
    .legend .note { font-size: 11px; color: var(--muted); }
    /* 凡例の電車の見本（#198）。地図の印（.station .glyph）と同じ形で、少し大きめ */
    .legend .glyph {
      width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 1px solid var(--ink);
      display: inline-flex; align-items: center; justify-content: center; color: var(--ink); flex: none;
    }
    .legend .glyph svg { width: 14px; height: 14px; }

    /* ---- 欄（はまこく Exp. の申込書と同じ、項目名の列と罫線） ---- */
    .controls { display: grid; grid-template-columns: 80px minmax(0, 1fr); border: 2px solid var(--ink); }
    .controls > .label {
      background: var(--field-bg); padding: 0 10px; display: flex; align-items: center;
      font-family: var(--font-sans); font-size: 11px; font-weight: 700; border-bottom: 1px solid var(--ink);
    }
    .controls > .opts { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border-bottom: 1px solid var(--ink); }
    .controls > :nth-last-child(-n + 2) { border-bottom: 0; }
    .seg {
      min-height: 32px; padding: 0 8px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
      display: inline-flex; align-items: center; gap: 4px;
      font-family: var(--font-sans); font-size: 11px; font-weight: 700; cursor: pointer;
    }
    /* 「地図に出す」の見本。押されている側は白抜きになるので、色は currentColor に乗せる */
    .seg .ico { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; flex: none; color: currentColor; }
    /* 見本の縦横比はそれぞれ違う（バス停は縦長）。枠に収める形で、比を保って縮める */
    .seg .ico svg { max-width: 100%; max-height: 100%; width: auto; height: auto; }
    .seg .ico .tri { position: static; filter: none; }
    .seg .ico .tri polygon { fill: currentColor; }
    .seg[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

    .panel { border: 2px solid var(--ink); display: flex; flex-direction: column; background: var(--paper); }

    /* 展示モードの動き（#189）。来場者は触らないので、めくったことが
       目で分かるように動きをつける。ふだんの画面では動かさない */
    @keyframes kiosk-pop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.65); }
      60%  { transform: scale(0.92); }
      100% { transform: scale(1); }
    }
    @keyframes kiosk-ring {
      0%   { transform: scale(0.6); opacity: 0.85; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    @keyframes kiosk-fade {
      0%   { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    /* 印そのものは placeMarker が transform で位置を決めているので、
       跳ねるのは中身（.body / svg）だけにする。位置の指定と喧嘩させない */
    .kiosk .stop.pop svg, .kiosk .bus.pop .body, .kiosk .pin.pop .pin-num, .kiosk .dep-label.pop span,
    .kiosk .station.pop .glyph {
      animation: kiosk-pop 620ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    /* 跳ねるのに合わせて広がる輪。選ばれたものの位置を遠目でも拾えるようにする */
    .kiosk .ping {
      position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px;
      border: 2px solid var(--red); border-radius: 50%; pointer-events: none; z-index: 5;
    }
    .kiosk .ping i { display: block; width: 100%; height: 100%; border-radius: 50%; animation: kiosk-ring 900ms ease-out forwards; }
    .kiosk #panels .panel, .kiosk .dep-callout { animation: kiosk-fade 420ms ease-out; }
    /* 展示モードは遠目に見るので、いまめくっているものを目立たせる（#194）。
       全部薄くすると地図が死ぬので、**同じ種類のほかの印だけ**を薄くする。
       ふだんの画面では全部そのまま。何も選んでいない間（切り替えの一拍）も全部そのまま */
    .kiosk .map-markers > *, .kiosk .dep { transition: opacity 320ms ease; }
    .kiosk .map-viewport[data-focus="stop"] .stop:not(.on),
    .kiosk .map-viewport[data-focus="bus"] .bus:not(.on),
    .kiosk .map-viewport[data-focus="station"] .station:not(.on),
    .kiosk .map-viewport[data-focus="dep"] .dep-label:not(.on),
    .kiosk .map-viewport[data-focus="dep"] .dep:not(.on) { opacity: 0.4; }
    /* 動きを控えめにする設定のときは、動かさない */
    /* 動きを控えめにする設定のときは流さず、折り返して全部出す */
    @media (prefers-reduced-motion: reduce) {
      .line-head .info, .line-head .info .body { overflow: visible; }
      .line-head .info .track { display: block; white-space: normal; animation: none; }
      .line-head .info .track .dup { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .kiosk .stop.pop svg, .kiosk .bus.pop .body, .kiosk .pin.pop .pin-num, .kiosk .dep-label.pop span,
      .kiosk .station.pop .glyph,
      .kiosk .ping i, .kiosk #panels .panel, .kiosk .dep-callout { animation: none; }
      .kiosk .ping { display: none; }
      .kiosk .map-markers > *, .kiosk .dep { transition: none; }
    }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; background: var(--ink); color: var(--on-ink); }
    .panel-head h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.06em; line-height: 1.4; }
    .panel-head .x { width: var(--tap-min); height: 36px; border: 0; background: none; color: var(--on-ink); font-size: 18px; cursor: pointer; }
    .panel-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding: 8px 12px; border-bottom: 1px dotted var(--muted); font-family: var(--font-sans); font-size: 12px; }
    .panel-foot { margin: 0; padding: 6px 12px 8px; border-top: 1px dotted var(--muted); font-family: var(--font-sans); font-size: 11px; line-height: 1.7; color: var(--muted); }
    .panel-foot a, .panel-foot button.link { color: var(--ink); }
    .panel-empty { margin: 0; padding: 10px 12px; font-size: 14px; }
    .late { color: var(--red); font-weight: 700; }
    /* 遅れで訂正した時刻（#200）。もとの時刻に赤い二重線を引く */
    .ride-row .was {
      margin-right: 5px; color: var(--muted); font-weight: 400;
      text-decoration: line-through double var(--red); text-decoration-thickness: 2px;
    }
    .muted { color: var(--muted); }
    button.link { border: 0; background: none; padding: 0; text-decoration: underline; cursor: pointer; font-family: var(--font-sans); font-size: 11px; }

    /* 発車時刻の行 */
    .dep-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 12px; border-top: 1px dotted var(--muted); }
    .dep-row:first-of-type { border-top: 0; }
    .dep-row .t { font-size: 24px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .dep-row .what { min-width: 0; font-size: 14px; line-height: 1.4; }
    .dep-row .what small { display: block; font-family: var(--font-sans); font-size: 11px; color: var(--muted); }
    .dep-row .left { font-family: var(--font-sans); font-size: 12px; font-weight: 700; text-align: right; }
    .dep-row .left .late { display: block; font-size: 11px; }
    /* 駅の欄（#186）。路線 → 方向 → 便 の3段で並べる */
    /* 運行情報の本文は長い（実例: 46 字「東海道線は、高崎線内での踏切安全確認の影響で…」）。
       折り返しを許して、路線名が潰れないようにする（#200） */
    .line-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 8px; padding: 9px 12px 1px; border-top: 1px solid var(--ink); font-family: var(--font-sans); font-size: 13px; font-weight: 800; }
    .line-head > span:first-child { flex: none; }
    .line-head:first-of-type { border-top: 0; }
    /* 運行情報（#200）。配信なし＝灰、平常＝青、それ以外＝赤。紫は使わない（ADR-0011）。
       本文は長いので折り返さず1行のまま流す。狭いときは自分の行に落ちてから流れる */
    .line-head .info {
      display: inline-flex; align-items: baseline;
      font-family: var(--font-sans); font-size: 11px; font-weight: 700;
      padding: 1px 5px; border: 1px solid currentColor; border-radius: 3px; line-height: 1.5;
      flex: 0 1 auto; max-width: 100%; overflow: hidden;
    }
    /* 「運行情報：」は動かさない。流れるのは本文だけ */
    .line-head .info .label { flex: none; }
    .line-head .info .body { flex: 0 1 auto; min-width: 0; overflow: hidden; }
    /* 幅の下限は流すときだけ。短い文（「平常運転」）まで広げると右に余白ができる */
    .line-head .info.flow .body { min-width: min(110px, 100%); }
    .line-head .info .track { display: inline-flex; gap: 32px; white-space: nowrap; }
    .line-head .info:not(.flow) .track .dup { display: none; }
    .line-head .info.flow .track { animation: info-flow var(--dur, 10s) linear infinite; }
    /* 駅の電光掲示板と同じで、一方向に送り続ける。1つ目が抜けると2つ目が入るので切れ目が無い */
    @keyframes info-flow {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(-1 * var(--shift, 0px))); }
    }
    .line-head .info.none { color: var(--muted); }
    .line-head .info.ok { color: var(--ink); }
    .line-head .info.bad { color: var(--red); }
    .dir-head { padding: 5px 12px 0; font-family: var(--font-sans); font-size: 11px; font-weight: 700; color: var(--muted); }
    .dir-head + .dep-row { border-top: 0; }
    /* 1本目は押して残りを開ける行（#186）。見た目は普通の行に合わせる */
    button.dep-row { width: 100%; border: 0; border-top: 1px dotted var(--muted); background: none; text-align: left; cursor: pointer; font: inherit; color: inherit; }
    .dir-head + button.dep-row { border-top: 0; }
    button.dep-row .chev {
      position: absolute; right: 12px; bottom: 4px; width: 0; height: 0;
      border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--muted);
    }
    button.dep-row { position: relative; padding-bottom: 12px; }
    button.dep-row.open .chev { transform: rotate(180deg); }
    /* 開いた残りの便は、1本目より少し弱く出す */
    button.dep-row.open + .dep-row, button.dep-row.open + .dep-row + .dep-row { background: var(--tint-color); }
    .dep-row .where { display: block; font-family: var(--font-sans); font-size: 11px; font-weight: 400; color: var(--muted); }

    /* バスの欄の、この先止まるバス停 */
    .ride-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 12px; }
    .ride-row .dot { width: 10px; height: 10px; justify-self: center; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); }
    .ride-row.next .dot { background: var(--ink); }
    .ride-row .name { min-width: 0; font-size: 14px; font-weight: 700; line-height: 1.35; }
    .ride-row.terminal .name { font-size: 16px; }
    .ride-row .name small { display: block; font-family: var(--font-sans); font-size: 11px; font-weight: 400; color: var(--muted); }
    .ride-row .time { font-size: 18px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .ride-row.terminal .time { font-size: 24px; }
    .ride-row .time small { font-family: var(--font-sans); font-size: 11px; font-weight: 700; margin-left: 2px; }

    /* ポートの一覧 */
    /* よく使うバス停（#146）。ポート一覧と同じ紙で、上に置く */
    .favorites { margin-bottom: 10px; }
    .fav-row { display: flex; align-items: stretch; border-top: 1px dotted var(--muted); }
    .fav-row:first-of-type { border-top: 0; }
    .fav-row .open {
      flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline;
      padding: 8px 4px 8px 12px; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
    }
    /* 一覧から外す。誤って押さないよう、開くほうとは離して細く置く */
    .fav-row .drop {
      flex: none; width: var(--tap-min); border: 0; border-left: 1px dotted var(--muted); background: none;
      color: var(--muted); font-size: 14px; cursor: pointer;
    }
    .fav-row .name { font-size: 15px; font-weight: 700; }
    .fav-row .t { font-family: var(--font-serif); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .fav-row .left { font-family: var(--font-sans); font-size: 12px; font-weight: 700; }
    .fav-row .muted { color: var(--muted); font-weight: 400; }
    /* 欄の見出しに置く「よく使う」の切り替え */
    .fav-toggle {
      border: 1px solid var(--on-ink); background: none; color: var(--on-ink); cursor: pointer;
      font-family: var(--font-sans); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 3px;
    }
    .fav-toggle.on { background: var(--on-ink); color: var(--ink); }

    .list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 12px; border-bottom: 2px solid var(--ink); }
    .list-head h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.1em; }
    .list-head span { font-family: var(--font-sans); font-size: 11px; }
    .port-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border-bottom: 1px dotted var(--muted); }
    .port-row.active { background: var(--selected-bg); }
    .port-row .n {
      width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--on-ink);
      display: flex; align-items: center; justify-content: center; font-family: var(--font-sans); font-size: 12px; font-weight: 700;
    }
    .port-row.key .n { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
    .port-row .name { font-size: 15px; font-weight: 700; line-height: 1.4; }
    .port-row .sub { display: block; font-family: var(--font-sans); font-size: 11px; font-weight: 400; color: var(--muted); }
    .port-row .counts { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .port-row .counts .row { display: flex; gap: 4px; align-items: baseline; }
    /* 事業者の印は数字の横（#199）。中に入れると、2つ並んだときに一つの数に見える */
    .count { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-sans); font-size: 11px; font-weight: 700; }
    .count + .count { margin-left: 12px; }
    .count i { display: block; width: 9px; height: 9px; border-radius: 2px; flex: none; }
    .count i.hellocycling { background: var(--hello); }
    .count i.docomo { background: var(--docomo); }
    .count b { font-family: var(--font-serif); font-size: 17px; font-weight: 800; line-height: 1; }
    .count.big b { font-size: 24px; }
    .count.big i { width: 11px; height: 11px; }
    .count.zero b { color: var(--zero-fg); }
    .count.na { color: var(--muted); }
    /* 貸出が止まっているとき（#201）。満と同じく赤で出す */
    .count.closed b { color: var(--red); font-size: 15px; }
    .count.big.closed b { font-size: 20px; }
    .count.na i { opacity: 0.35; }
    /* 「返す」の下に並ぶ数字が何なのか分かるように添える見出し */
    .counts .lead { font-family: var(--font-sans); font-size: 11px; font-weight: 700; margin-right: 5px; }
    .dock { font-family: var(--font-sans); font-size: 11px; }
    .dock.full { color: var(--red); font-weight: 700; }
    .dock.big { font-size: 12px; font-weight: 700; }
    .dock.big b { font-family: var(--font-serif); font-size: 24px; font-weight: 800; margin-left: 3px; }
    .dock .ops { margin-left: 6px; }
    .dock.big .ops i { width: 11px; height: 11px; }
    /* 断り書き（#199）。読み飛ばされないよう、枠で囲って肝を太字にする */
    .more .notice { border: 1px solid var(--muted); padding: 6px 8px; }
    .more ul.plain { margin: 4px 0 0; padding-left: 1.2em; }
    .more ul.plain li { margin: 2px 0; }
    /* はまこく Exp. への導線（#199） */
    .to-exp a { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; }
    .to-exp .wordmark { width: min(240px, 70vw); height: auto; }
    .to-exp .wordmark.dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .to-exp .wordmark.light { display: none; }
      .to-exp .wordmark.dark { display: inline; }
    }
    /* 報告・お問い合わせ（#204）。欄（.panel）と同じ紙と罫線にそろえる */
    .report-dialog { width: min(420px, calc(100vw - 32px)); padding: 0; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); }
    .report-dialog::backdrop { background: rgba(14, 30, 58, 0.45); }
    .report-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; font-family: var(--font-sans); font-size: 12px; }
    .report-lead { margin: 0; color: var(--muted); }
    .report-field { display: flex; flex-direction: column; gap: 3px; }
    .report-field > span { font-weight: 700; }
    .report-field select, .report-field textarea {
      font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--ink); border-radius: 0; padding: 6px;
    }
    .report-field select { min-height: var(--tap-min); }
    .report-context { margin: 0; padding: 6px 8px; background: var(--field-bg); white-space: pre-wrap; }
    .report-error { margin: 0; color: var(--red); font-weight: 700; }
    .report-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 12px 12px; }
    .report-actions .btn.send { background: var(--ink); color: var(--on-ink); }
    /* 罠の欄は人に見せない（display:none だと自動入力に無視されることがあるので、画面の外へ出す） */
    #report-honeypot { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
    /* 報告を開くボタン。欄の足や免責の中に置く */
    .report-open { border: 0; background: none; padding: 0; font: inherit; color: var(--ink); text-decoration: underline; cursor: pointer; }

    .more { padding: 8px 12px 10px; font-family: var(--font-sans); font-size: 12px; line-height: 1.7; }
    .more summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; font-weight: 700; }
    .more p { margin: 6px 0 0; }
    .more dl { margin: 6px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; }
    .more dt { font-weight: 700; white-space: nowrap; }
    .more dd { margin: 0; }
    .more table { width: 100%; margin-top: 8px; border-collapse: collapse; }
    .more th, .more td { text-align: left; padding: 3px 4px; border-top: 1px dotted var(--muted); vertical-align: top; }
    .more td.num { text-align: right; white-space: nowrap; }

    /* ---- 足もと ---- */
    footer { margin-top: 8px; border-top: 1px solid var(--ink); padding-top: 10px; font-family: var(--font-sans); font-size: 12px; line-height: 1.7; }
    footer p, footer ul { margin: 0 0 6px; }
    footer ul { padding-left: 1.2em; }
    footer .to-exp { font-family: var(--font-serif); font-size: 14px; font-weight: 700; }
    .error { color: var(--red); font-weight: 700; }

    /* ========================================================================
       展示モード（#180）。/hamakokumap/?kiosk で開いたときだけ。
       地図を画面いっぱいに出し、見出し・欄は地図の上に重ねる。操作の欄・凡例・一覧は出さない
       ======================================================================== */
    body.kiosk { overflow: hidden; }
    .kiosk .page { max-width: none; height: 100vh; height: 100dvh; padding: 0; gap: 0; position: relative; }
    /* 仮データで表示しているときの帯（#276。公開用のコピーだけ。サーバが応答の demo で知らせる）。赤は「いつもと違うこと」 */
    .demo-banner { margin: 0 0 10px; padding: 10px 14px; border: 3px solid var(--red, #C8322B); background: var(--paper); color: var(--red, #C8322B); text-align: center; font-family: var(--font-sans, sans-serif); }
    .demo-banner[hidden] { display: none; }
    .demo-banner p { margin: 0; }
    .demo-banner .demo-main { font-size: 20px; font-weight: 700; line-height: 1.5; }
    .demo-banner .demo-sub { margin-top: 2px; font-size: 12px; }
    .kiosk .demo-banner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 9; width: max-content; max-width: 40%; margin: 0; padding: 6px 12px; }
    .kiosk .demo-banner .demo-main { font-size: 17px; }
    .kiosk .masthead { position: absolute; top: 12px; left: 12px; z-index: 8; align-items: center; gap: 14px; padding: 6px 12px; background: color-mix(in srgb, var(--paper) 92%, transparent); border: 2px solid var(--ink); }
    .kiosk .masthead h1 { font-size: 22px; }
    .kiosk .masthead h1 .wordmark { width: 340px; } /* 「シェアサイクルとバスのいま」まで読める大きさ */
    .kiosk #refresh { display: none; }
    .kiosk .clock { display: none; }
    .kiosk .layout { display: block; height: 100%; }
    .kiosk .map-col { height: 100%; gap: 0; }
    .kiosk .map-frame { height: 100%; }
    .kiosk .map-viewport { height: 100%; aspect-ratio: auto !important; border: 0; }
    /* 地図が画面の端まで来るので、SVG が隅に描いているもの（左下のスケールバー・右下の出典）を
       避ける位置に置く。つまみは左の中ほど、出典は下の中央（#180） */
    /* 展示は触らせず流すだけ（#187）。つまみは出さず、地図の上のものも押せなくする。
       倍率と位置は URL（?zoom= / ?center=）で決める */
    .kiosk .map-zoom { display: none !important; }

  <script>
    (function () {
      const data = window.CYCLEMAP_PORTS;
      if (!data) {

      // ---- 設定 ----

      const OPERATORS = Object.keys(data.operators);
      const SHORT_LABEL = { hellocycling: "HELLO", docomo: "ドコモ" };
      // エリアのタブの名前
      const AREA_TAB = { "ynu-campus": "国大", "yokohama-station": "横浜駅" };
      // はまこく Exp. の出発地（#179）。Exp. のフォームの departure の値 → 地図での呼び名
      const DEPARTURE_NAME = { Library: "中央図書館", Shokudo1: "第1食堂", Shokudo2: "第2食堂", RikoA: "理工講義棟A" };
      const DEPARTURE_SHORT = { Library: "図書館", Shokudo1: "第1食堂", Shokudo2: "第2食堂", RikoA: "理工A" };
      const EXP_URL = "/hamakokuex/";

      // 展示モード（#180）。?kiosk=秒 で、最初に戻すまでの待ち時間を変えられる（既定 60 秒）
      const params = new URLSearchParams(location.search);
      const KIOSK = params.has("kiosk");
      // 展示モードは来場者に触らせず、流しておくだけにする（#187）。
      //   ?kiosk=秒      … 中身をめくる間隔（既定 10 秒）。以前はここが「操作が無ければ最初に戻すまでの秒数」だった
      //   ?zoom=倍       … 全体表示を 1 とした倍率。設営でプロジェクタに合わせるため
      //   ?center=緯度,経度 … その地点を画面の中央に置く。どのエリアの地図かは bbox から決める
      const KIOSK_STEP_MS = (Number(params.get("kiosk")) > 0 ? Number(params.get("kiosk")) : 10) * 1000;
      const KIOSK_ZOOM = Number(params.get("zoom")) > 0 ? Number(params.get("zoom")) : 1;
      const KIOSK_CENTER = (() => {
        const v = (params.get("center") ?? "").split(",").map(Number);
        return v.length === 2 && v.every(Number.isFinite) ? { lat: v[0], lon: v[1] } : null;
      })();

      // 展示モードでは、画面いっぱいに出したときに左右が余らないよう、横長の地図に差し替える（#181）。
      // 差し替わるのは地図まわり（svg・bbox・viewBox と、そこから焼いた値）だけで、
      // ポートは緯度経度のまま持っているので、描くときに新しい座標系へ写される
      if (KIOSK) {
        for (const area of data.areas) if (area.kiosk) Object.assign(area, area.kiosk);
        // 展示モードは地図の下の段を出さない。更新時刻は凡例の先頭に出す（#220。renderLegend）
      }

      // 「使うアプリ」は見る人ごとの好みなので、ブラウザに覚えておく（展示モードでは覚えない）
      const OP_KEY = "hamakokumap:operator";
      const OP_CHOICES = ["both", ...OPERATORS];
      function loadOp() {
        if (KIOSK) return "both";
        try { const v = localStorage.getItem(OP_KEY); if (OP_CHOICES.includes(v)) return v; } catch { /* 使えない環境 */ }
        return "both";
      }
      function saveOp(v) {
        if (KIOSK) return;
        try { localStorage.setItem(OP_KEY, v); } catch { /* 使えない環境 */ }
      }

      // よく使うバス停（#146）。毎回地図から探させないよう、覚えた停留所の次の発車を
      // 開いた時点で出す。端末ごとに持つ（サーバには置かない）ので、別の端末には引き継がれない。
      // 展示モードでは覚えないし、出さない
      const FAV_KEY = "hamakokumap:favoriteStops";
      const FAV_MAX = 4;   // 増やしすぎると地図が押し出されるので上限を置く

      function loadFavorites() {
        if (KIOSK) return [];
        try {
          const raw = JSON.parse(localStorage.getItem(FAV_KEY) ?? "[]");
          return Array.isArray(raw) ? raw.filter((n) => typeof n === "string").slice(0, FAV_MAX) : [];
        } catch {
          return [];
        }
      }

      function saveFavorites(names) {
        if (KIOSK) return;
        try { localStorage.setItem(FAV_KEY, JSON.stringify(names.slice(0, FAV_MAX))); } catch { /* 使えない環境 */ }
      }

      /** 覚えている停留所か */
      function isFavorite(name) {
        return state.favorites.includes(name);
      }

      /** 覚える・忘れるを切り替える。上限を超えたら古いものから落とす */
      function toggleFavorite(name) {
        const next = isFavorite(name)
          ? state.favorites.filter((n) => n !== name)
          : [...state.favorites, name].slice(-FAV_MAX);
        state.favorites = next;
        saveFavorites(next);
        renderFavorites();
        renderSelection();
      }

      // 画面の状態。sel は押したもの（バス停・バス・出発地の建物のどれか1つ）
      // openDir は駅の欄で「残りの便も開いている」方向（#186）。"路線id:方向id" の集まり
      const INITIAL = () => ({ area: data.areas[0].id, op: "both", layers: { ports: true, stops: true, buses: true, stations: true, exits: true }, sel: null, showAll: false, openDir: new Set() });
      const state = Object.assign(INITIAL(), { op: loadOp(), favorites: loadFavorites() });

      const SVG_NS = "http://www.w3.org/2000/svg";
      const areaById = new Map(data.areas.map((a) => [a.id, a]));
      const ui = new Map();   // areaId → { viewport, view, markers, pins: [...], stops: [...], buses: [...], deps: [...] }

      function svgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
      }
      function el(tag, attrs = {}, ...children) {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (v === null || v === undefined || v === false) continue;
          if (k === "class") e.className = v;
          else if (k === "text") e.textContent = v;
          else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
          else e.setAttribute(k, v === true ? "" : v);
        }
        for (const c of children) if (c !== null && c !== undefined && c !== false) e.append(c);
        return e;
      }
      function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
      function operatorLabel(id) { return (data.operators[id] && data.operators[id].label) || id; }
      function isReturnArea(area) { return area.role === "return"; }
      // 返却枠に制限が無いポート（#54）。空き台数の代わりに「空きあり」と出す（docs/gbfs-port-data.md）
      function isUnlimitedReturn(port) { return port.unlimitedReturn === true; }
      // 「使うアプリ」で選んだ事業者のうち、そのポートで使えるもの（表の並び順）
      function shownOps(port) {
        const ops = state.op === "both" ? OPERATORS : [state.op];
        return ops.filter((op) => port.availableOperators.includes(op));
      }
      function hhmm(d) { return d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }); }

      // データの時刻（生成時刻・取得日時）の表記。今日なら HH:mm、別の日なら M/D HH:mm（#220。ODPT ガイドライン 2.1.1・2.2.1）。
      // 読めなければ null
      function asOf(value) {
        const d = value instanceof Date ? value : new Date(value);
        if (!value || isNaN(d)) return null;
        return d.toDateString() === new Date().toDateString() ? hhmm(d) : `${d.getMonth() + 1}/${d.getDate()} ${hhmm(d)}`;
      }
      // 複数の時刻のうち、いちばん古いもの（「いつ時点の情報か」は、いちばん古い分に合わせて言う）
      function oldestOf(values) {
        const times = values.map((v) => (v ? new Date(v) : null)).filter((d) => d && !isNaN(d));
        return times.length ? new Date(Math.min(...times)) : null;
      }

      // 緯度経度 → SVG 座標。bbox を線形に内挿するだけ（北が上なので y は反転）
      function project(p, area) {
        const { bbox, viewBox } = area;
        return {
          x: (p.lon - bbox.lonMin) / (bbox.lonMax - bbox.lonMin) * viewBox.width,
          y: (bbox.latMax - p.lat) / (bbox.latMax - bbox.latMin) * viewBox.height,
        };
      }

      // ---- リアルタイムの空き台数 ----
      //
      // まず自分のサーバ（/hamakokumap/api/status）を見る。そこが ODPT から取ってキャッシュしている。
      // この口が無いとき（file:// や、Live Server などで静的に配ったとき）は api-public から直接読む
      const STATUS_API = "api/status";
      const STATUS_FEEDS = {
        hellocycling: "https://api-public.odpt.org/api/v4/gbfs/hellocycling/station_status.json",
        docomo: "https://api-public.odpt.org/api/v4/gbfs/docomo-cycle/station_status.json",
      };
      // 事業者 → { stations: Map<station_id, status>, lastUpdated: Date } | null（取得失敗）| undefined（未取得）
      const realtime = {};

      function statusFor(port, op) {
        const feed = realtime[op];
        const id = port.feedIds && port.feedIds[op];
        if (!feed || !id) return null;
        return feed.stations.get(String(id)) || null;
      }

      // 空きドックを信用してよい事業者。HELLO CYCLING の空きは「両社あわせた実際の空き」を
      // 見ているのに対し、ドコモの空きは自社ぶんの計算値なので、足しても並べても意味が無い。
      // 「4 / 3」のように事業者ごとに出していたのをやめ、HELLO の値だけを使う
      // （app_v1/config/providers/cycleProviders.js の TRUSTED_DOCKS_PROVIDER と同じ考え）
      const TRUSTED_DOCKS_OP = "hellocycling";

      /**
       * 返せる空きを1つにまとめる。
       * @returns {{kind:"none"|"closed"|"unlimited"|"number", value?:number}}
       */
      function returnInfo(port, ops) {
        const found = ops.map((op) => statusFor(port, op)).filter(Boolean);
        if (!found.length) return { kind: "none" };
        if (!found.some((st) => st.is_returning !== false)) return { kind: "closed" };
        if (isUnlimitedReturn(port)) return { kind: "unlimited" };
        // HELLO がいないポート（ドコモにしか無い）は、残った事業者の値をそのまま使う
        const trusted = (ops.includes(TRUSTED_DOCKS_OP) && statusFor(port, TRUSTED_DOCKS_OP)) || found[0];
        const n = trusted.num_docks_available;
        if (n === null || n === undefined) return { kind: "none" };
        // フィードが負の値を返すことがある（#206）。HELLO の空きは「両社あわせた実際の空き」なので、
        // 止まっている台数がラック数を超えると負になる。返せないことに変わりはないので 0（＝満）に倒す
        return { kind: "number", value: Math.max(0, n) };
      }

      /**
       * その事業者でいま借りられるか（#201）。GBFS の is_renting が false のとき、
       * 利用時間外などで貸出が止まっている。
       *
       * **返却側（is_returning）と見方が違う。** 返す場所（ドック）は事業者で共通なので
       * returnInfo は全事業者が false のときだけ閉鎖にするが、自転車は事業者ごとに分かれて
       * いるので、ポート全体ではなく**その事業者だけ**を止める
       *
       * @param {object | null} status - station_status の1件
       * @returns {boolean} false なら貸出停止
       */
      function canRent(status) {
        return status?.is_renting !== false;
      }

      /**
       * どの事業者で返せるかの印。数字の見た目は全ポートで同じにして、事業者は小さな色の
       * 四角だけで示す。札ごと色を変えると、ドコモにしか無いポートが赤く目立ってしまう
       */
      function opsMark(ops) {
        return el("span", { class: "ops", "aria-hidden": "true" },
          ...ops.map((op) => el("i", { class: op, title: `${operatorLabel(op)} で返せます` })));
      }

      // ---- 地図の拡大縮小・パン（#174 の作りを引き継ぐ）----
      const MAX_ZOOM_FACTOR = 8;   // 全体表示の何倍まで寄れるか
      const ZOOM_STEP = 1.6;       // ＋／− 1回ぶん
      const DRAG_SLOP = 5;         // これ以上動いたらタップではなくドラッグ扱い（px）

      /**
       * 1つの地図の拡大縮小・パンを受け持つ。
       * scale は「全体表示（fit）」を下限、その MAX_ZOOM_FACTOR 倍を上限にする。
       * 縮尺が小さくて中身が枠より小さいときは、はみ出させずに中央に寄せる
       */
      function createMapView(area, viewport, canvas) {
        const W = area.viewBox.width;
        const H = area.viewBox.height;
        const view = { viewport, scale: 1, fit: 1, tx: 0, ty: 0, atFit: true };

        function clampPan() {
          const vp = viewport.getBoundingClientRect();
          const cw = W * view.scale;
          const ch = H * view.scale;
          view.tx = cw <= vp.width ? (vp.width - cw) / 2 : clamp(view.tx, vp.width - cw, 0);
          view.ty = ch <= vp.height ? (vp.height - ch) / 2 : clamp(view.ty, vp.height - ch, 0);
        }

        function apply() {
          clampPan();
          canvas.style.transform = `translate(${view.tx.toFixed(2)}px, ${view.ty.toFixed(2)}px) scale(${view.scale.toFixed(4)})`;
          view.atFit = view.scale <= view.fit * 1.001;
          if (view.onChange) view.onChange();
        }

        // 枠の大きさが変わったら全体表示の倍率を取り直す。全体表示のままだった地図は合わせ直す
        function measure() {
          const vp = viewport.getBoundingClientRect();
          if (!vp.width || !vp.height) return;
          const wasAtFit = view.atFit;
          view.fit = Math.min(vp.width / W, vp.height / H);
          view.scale = wasAtFit ? view.fit : clamp(view.scale, view.fit, view.fit * MAX_ZOOM_FACTOR);
          apply();
        }

        // 枠の中の (cx, cy) を動かさずに倍率を変える
        function zoomAt(factor, cx, cy) {
          const next = clamp(view.scale * factor, view.fit, view.fit * MAX_ZOOM_FACTOR);
          if (next === view.scale) return;
          const px = (cx - view.tx) / view.scale;
          const py = (cy - view.ty) / view.scale;
          view.scale = next;
          view.tx = cx - px * next;
          view.ty = cy - py * next;
          apply();
        }

        function zoomBy(factor) {
          const vp = viewport.getBoundingClientRect();
          zoomAt(factor, vp.width / 2, vp.height / 2);
        }

        function reset() {
          view.scale = view.fit;
          apply();
        }

        /** 地図の座標 (x, y) が枠の中（margin の内側）に入るところまでだけ動かす */
        function ensureVisible(x, y, margin = 40) {
          const vp = viewport.getBoundingClientRect();
          const sx = view.tx + x * view.scale;
          const sy = view.ty + y * view.scale;
          if (sx < margin) view.tx += margin - sx;
          else if (sx > vp.width - margin) view.tx -= sx - (vp.width - margin);
          if (sy < margin) view.ty += margin - sy;
          else if (sy > vp.height - margin) view.ty -= sy - (vp.height - margin);
          apply();
        }

        // ---- 指・マウスの受け付け ----
        // 1本（マウスの左ドラッグ）で移動、2本でピンチ。
        // touch-action: none にしてあるので、地図の上では指の動きがすべてここに来る
        const pointers = new Map();
        let pinchStart = null;
        let moved = false;

        // ポインタを掴む（setPointerCapture）のは、実際に動かし始めてから。
        // pointerdown の時点で掴むと、あとから出る click まで枠に付け替わり、中の印が押せなくなる
        function capture(id) {
          if (viewport.hasPointerCapture(id)) return;
          try { viewport.setPointerCapture(id); } catch { /* すでに離れている */ }
        }

        viewport.addEventListener("pointerdown", (e) => {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          // 建物の吹き出しの上で始まったものは、中のリンクのために動かさない
          if (e.target.closest(".dep-callout")) return;
          pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, from: { x: e.clientX, y: e.clientY } });
          moved = false;
          if (pointers.size === 2) {
            const [a, b] = [...pointers.values()];
            pinchStart = { dist: Math.hypot(a.x - b.x, a.y - b.y), scale: view.scale };
            for (const id of pointers.keys()) capture(id);
          }
          viewport.classList.add("dragging");
        });

        viewport.addEventListener("pointermove", (e) => {
          const prev = pointers.get(e.pointerId);
          if (!prev) return;
          const next = { x: e.clientX, y: e.clientY, from: prev.from };
          const vp = viewport.getBoundingClientRect();

          if (pointers.size === 1) {
            // 押した場所から少し離れるまでは、タップのつもりとみなして動かさない
            if (!moved && Math.hypot(next.x - prev.from.x, next.y - prev.from.y) <= DRAG_SLOP) {
              pointers.set(e.pointerId, next);
              return;
            }
            if (!moved) { moved = true; capture(e.pointerId); }
            view.tx += next.x - prev.x;
            view.ty += next.y - prev.y;
            apply();
          } else if (pointers.size === 2 && pinchStart) {
            moved = true;
            pointers.set(e.pointerId, next);
            const [a, b] = [...pointers.values()];
            const dist = Math.hypot(a.x - b.x, a.y - b.y);
            const target = clamp(pinchStart.scale * (dist / pinchStart.dist), view.fit, view.fit * MAX_ZOOM_FACTOR);
            zoomAt(target / view.scale, (a.x + b.x) / 2 - vp.left, (a.y + b.y) / 2 - vp.top);
          }
          pointers.set(e.pointerId, next);
        });

        function endPointer(e) {
          pointers.delete(e.pointerId);
          if (pointers.size < 2) pinchStart = null;
          if (pointers.size === 0) viewport.classList.remove("dragging");
        }
        viewport.addEventListener("pointerup", endPointer);
        viewport.addEventListener("pointercancel", endPointer);

        // ドラッグし終わったところが印の上だと、クリック扱いになってしまう。動かしたときだけ握りつぶす
        viewport.addEventListener("click", (e) => {
          if (!moved) return;
          moved = false;
          e.stopPropagation();
          e.preventDefault();
        }, true);

        // トラックパッドのピンチは ctrl 付きのホイールとして来る。素のホイールはページのスクロールに残す
        viewport.addEventListener("wheel", (e) => {
          if (!e.ctrlKey && !e.metaKey) return;
          e.preventDefault();
          const vp = viewport.getBoundingClientRect();
          zoomAt(Math.exp(-e.deltaY / 180), e.clientX - vp.left, e.clientY - vp.top);
        }, { passive: false });

        viewport.addEventListener("dblclick", (e) => {
          if (e.target.closest("button, a, .dep")) return;
          const vp = viewport.getBoundingClientRect();
          zoomAt(ZOOM_STEP, e.clientX - vp.left, e.clientY - vp.top);
        });

        // 設営時に「ここを中央に」と決められるように（#187）
        function panTo(x, y) {
          const vp = viewport.getBoundingClientRect();
          view.tx = vp.width / 2 - x * view.scale;
          view.ty = vp.height / 2 - y * view.scale;
          apply();
        }

        Object.assign(view, { measure, zoomBy, zoomAt, reset, ensureVisible, apply, panTo });
        if (typeof ResizeObserver === "function") new ResizeObserver(measure).observe(viewport);
        else window.addEventListener("resize", measure);
        return view;
      }

      // ---- 地図の上の印 ----

      const BIKE_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M5.5 17 9 9h6l3.5 8M9 9 7.5 6H6M15 9l-3 8M12 6h3"/></svg>';
      const STOP_SVG = '<svg width="13" height="19" viewBox="0 0 14 20" aria-hidden="true"><rect x="6.2" y="10" width="1.6" height="8.5" fill="currentColor"/><rect x="3.5" y="18" width="7" height="1.6" rx="0.8" fill="currentColor"/><circle cx="7" cy="6.5" r="6" fill="currentColor"/><circle cx="7" cy="6.5" r="3.4" fill="var(--paper)"/></svg>';
      const BUS_GLYPH = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--paper)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a2 2 0 0 1 2 2v12H4V5a2 2 0 0 1 2-2zM4 11h16M7 17v3M17 17v3"/></svg>';
      // 駅（#186・#194）。電車と分かる形にして、その下に事業者名を出す
      const TRAIN_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14"/><path d="M9 17 6.5 21M15 17 17.5 21"/></svg>';
      // 駅の出口（#192）。下の頂点が出口の位置に当たるように置く
      const EXIT_SVG = '<svg class="tri" width="10" height="9" viewBox="0 0 10 9" aria-hidden="true"><polygon points="1,1 9,1 5,8"/></svg>';
      const BUS_DIR = '<svg class="dir" viewBox="0 0 30 30" aria-hidden="true"><polygon points="15,0 20,7 10,7" fill="currentColor" stroke="var(--paper)" stroke-width="1.2" stroke-linejoin="round"/></svg>';

      // 印を地図の座標 (x, y) に合わせて置く（大きさは変えない）
      function placeMarker(node, view, x, y) {
        node.style.transform = `translate(${(view.tx + x * view.scale).toFixed(1)}px, ${(view.ty + y * view.scale).toFixed(1)}px)`;
      }

      /**
       * 駅の札を置く（#186）。札は本当の位置から縦にずれていることがあるので、
       * ずれた分だけ細い線を引いて、どの点の札なのかを分かるようにする
       */
      function placeStation(m, view) {
        placeMarker(m.node, view, m.x, m.y);
        m.mark.style.marginTop = `${m.dy.toFixed(1)}px`;
        m.lead.hidden = Math.abs(m.dy) < 2;
        m.lead.style.height = `${Math.abs(m.dy).toFixed(1)}px`;
        m.lead.style.marginTop = `${Math.min(0, m.dy).toFixed(1)}px`;
      }

      /**
       * 駅の札が重ならないよう、近すぎるものを縦に並べ直す（#186）。
       *
       * 横浜駅は JR・相鉄・京急・東急が 130m ほどの中に集まっていて、スマホの幅
       * （縮尺 0.43 倍）では JR と相鉄が 10px しか離れない。そのままでは札が重なって読めないので、
       * 縦に近い札をひと塊とみなし、塊の重心を中心に等間隔に置き直す。
       * 拡大すれば自然とずれが 0 に戻る
       */
      function layoutStations(areaId) {
        const u = ui.get(areaId);
        if (!u.stations.length) return;
        const { view } = u;
        const PITCH = 31;   // 印の高さ（アイコン16 ＋ すき間1 ＋ 名前11）＋ すき間
        const NEAR_X = 40;  // 横がこれより近ければ、縦に重なる相手とみなす（名前の幅ぶん）
        const items = u.stations
          .map((m) => ({ m, sy: view.ty + m.y * view.scale, sx: view.tx + m.x * view.scale }))
          .sort((a, b) => a.sy - b.sy);
        const near = (a, b) => Math.abs(a.sy - b.sy) < PITCH && Math.abs(a.sx - b.sx) < NEAR_X;

        // 重なる相手が1つでもあれば同じ塊に入れる。縦の順に見るだけだと、間に遠くの札
        // （地下鉄は 240m 西）が挟まったときに塊が切れてしまう
        const groups = [];
        for (const it of items) {
          const group = groups.find((g) => g.some((other) => near(other, it)));
          if (group) group.push(it);
          else groups.push([it]);
        }
        // 塊の重心を中心に等間隔へ。重心にそろえるので、ずれる量は左右対称で小さく済む
        for (const group of groups) {
          const mid = group.reduce((sum, it) => sum + it.sy, 0) / group.length;
          group.forEach((it, n) => { it.ty = mid + (n - (group.length - 1) / 2) * PITCH; });
        }
        // 置き直した結果、別の塊と当たることがある。縦の順に下へ押し出して離す
        const placed = [...items].sort((a, b) => a.ty - b.ty);
        placed.forEach((it, i) => {
          for (let j = 0; j < i; j++) {
            if (Math.abs(placed[j].sx - it.sx) < NEAR_X && it.ty - placed[j].ty < PITCH) it.ty = placed[j].ty + PITCH;
          }
        });
        // 出口の三角（#192）は位置そのものが情報なので動かさない。代わりに駅の札をどける。
        // 横浜駅では、相鉄の札とみなみ西口が 3px、京急の札ときた東口B が 8px しか離れていない
        // 三角は出口の位置から EXIT_UP だけ上に立っている（先が位置に当たる）。
        // 札は高さ MARK_H で ty が中心なので、三角の上下に MARK_H/2 ＋ すき間だけ逃がす
        const EXIT_UP = 9;
        const MARK_H = 28;
        const GAP = 2;
        const exits = u.exits.map((m) => ({ sx: view.tx + m.x * view.scale, sy: view.ty + m.y * view.scale }));
        for (const it of items) {
          for (const exit of exits) {
            if (Math.abs(exit.sx - it.sx) >= NEAR_X) continue;
            // 三角が占めるのは sy - EXIT_UP 〜 sy。札がそこに掛かっていなければ触らない
            if (it.ty - MARK_H / 2 >= exit.sy + GAP || it.ty + MARK_H / 2 <= exit.sy - EXIT_UP - GAP) continue;
            // 本来の位置が出口より下なら三角の下へ、そうでなければ三角の上へ逃がす
            it.ty = it.sy >= exit.sy ? exit.sy + MARK_H / 2 + GAP : exit.sy - EXIT_UP - MARK_H / 2 - GAP;
          }
        }
        for (const it of items) {
          it.m.dy = it.ty - it.sy;
          placeStation(it.m, view);
        }
      }

      function positionMarkers(areaId) {
        const u = ui.get(areaId);
        if (!u) return;
        const { view } = u;
        for (const m of [...u.pins, ...u.stops, ...u.buses, ...u.depLabels, ...u.exits]) placeMarker(m.node, view, m.x, m.y);
        layoutStations(areaId);
        layoutStopNames(areaId);
        if (u.callout) placeMarker(u.callout.node, view, u.callout.x, u.callout.y);
        // 倍率が変わったときだけ、台数の札の置き場所を決め直す（パンでは変わらない）
        if (u.laidOutAt !== view.scale && layoutPins(areaId)) u.laidOutAt = view.scale;
      }

      // バス停の名前の幅を測れないとき（スマホでは選ぶまで出していない）の目安。11px の字で1字あたり
      const STOP_NAME_CHAR_PX = 12;

      /**
       * バス停の名前を、地図の枠からはみ出さない側に出す（#234）。
       * 名前はふだん印の右に出すが、枠は overflow: hidden なので、右端の近く（構内の岡沢町は
       * x=1038 / 幅 1056）では名前が切れて見えなかった。右にはみ出すときだけ印の下に出す。
       * パンでも位置が変わるので、倍率に関係なく毎回決める（バス停は数個なので軽い）
       */
      function layoutStopNames(areaId) {
        const u = ui.get(areaId);
        const { view } = u;
        const vpW = u.viewport.clientWidth;
        if (!vpW) return;
        for (const s of u.stops) {
          const name = s.node.querySelector(".name");
          if (!name) continue;
          const width = name.offsetWidth || name.textContent.length * STOP_NAME_CHAR_PX;
          const sx = view.tx + s.x * view.scale;
          // .stop .name の left: 24px と同じ。右端に 2px の余裕を見る
          s.node.classList.toggle("name-left", sx + 24 + width > vpW - 2);
        }
      }

      function overlap(a, b) {
        const w = Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1);
        const h = Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1);
        return w > 0 && h > 0 ? w * h : 0;
      }

      /**
       * 台数の札を、ほかのピン・札・枠の外と重ならない側に置く（画面の px で考える）。
       * 右 → 左 → 右下 → 左下 → 右上 → 左上 の順に試し、重ならない候補が無ければ重なりが最小のもの。
       * 真横から外したときは、番号の丸から札へ短い線を引く
       */
      function layoutPins(areaId) {
        const u = ui.get(areaId);
        const { view } = u;
        const vpW = u.viewport.clientWidth;
        // 隠れている地図は大きさが測れない。出したときにやり直す
        if (!vpW) return false;
        const pins = u.pins.filter((p) => p.node.style.display !== "none");
        const r = pins.length ? pins[0].num.offsetWidth / 2 : 9;
        const placed = pins.map((p) => {
          const sx = view.tx + p.x * view.scale;
          const sy = view.ty + p.y * view.scale;
          return { x1: sx - r - 2, x2: sx + r + 2, y1: sy - r - 2, y2: sy + r + 2 };
        });
        const SHIFT = r + 8;
        const candidates = [["right", 0], ["left", 0], ["right", SHIFT], ["left", SHIFT], ["right", -SHIFT], ["left", -SHIFT]];
        for (const p of pins) {
          const w = p.tag.offsetWidth;
          const h = p.tag.offsetHeight;
          const sx = view.tx + p.x * view.scale;
          const sy = view.ty + p.y * view.scale;
          let best = null;
          for (const [side, dy] of candidates) {
            const x0 = side === "right" ? r + 3 : -(r + 3 + w);
            const rect = { x1: sx + x0, x2: sx + x0 + w, y1: sy + dy - h / 2, y2: sy + dy + h / 2 };
            const outside = rect.x1 < 0 || rect.x2 > vpW;
            const cost = placed.reduce((s, q) => s + overlap(rect, q), 0) + (outside ? 1e5 : 0);
            if (!best || cost < best.cost) best = { x0, dy, rect, cost };
            if (cost === 0) break;
          }
          placed.push(best.rect);
          p.tag.style.left = `${best.x0}px`;
          p.tag.style.top = `${best.dy - h / 2}px`;
          if (best.dy === 0) {
            p.lead.hidden = true;
          } else {
            // 丸の縁から札の手前の端の中ほどへ
            const tx = best.x0 > 0 ? best.x0 : best.x0 + w;
            const len = Math.hypot(tx, best.dy);
            p.lead.hidden = false;
            p.lead.style.width = `${len}px`;
            p.lead.style.transform = `rotate(${Math.atan2(best.dy, tx)}rad)`;
          }
        }
        return true;
      }

      function buildMap(area) {
        const viewport = el("div", { class: "map-viewport", "data-area": area.id });
        viewport.style.aspectRatio = `${area.viewBox.width} / ${area.viewBox.height}`;

        const canvas = el("div", { class: "map-canvas" });
        canvas.style.width = `${area.viewBox.width}px`;
        canvas.style.height = `${area.viewBox.height}px`;

        // 下地の簡略図。object にしておくと SVG 内の prefers-color-scheme が効く
        const base = el("object", { type: "image/svg+xml", data: area.svg, "aria-hidden": "true" });
        canvas.appendChild(base);

        // はまこく Exp. の出発地の建物（#179）。地図と一緒に拡大縮小する層
        const overlay = svgEl("svg", { viewBox: `0 0 ${area.viewBox.width} ${area.viewBox.height}`, "aria-hidden": "false" });
        canvas.appendChild(overlay);
        viewport.appendChild(canvas);

        const markers = el("div", { class: "map-markers" });
        viewport.appendChild(markers);

        const view = createMapView(area, viewport, canvas);
        const u = { viewport, view, markers, overlay, pins: [], stops: [], buses: [], stations: [], exits: [], depLabels: [], deps: new Map(), pings: [], callout: null, laidOutAt: null };
        ui.set(area.id, u);
        view.onChange = () => { positionMarkers(area.id); if (area.id === state.area) syncZoomButtons(); };

        // 出発地の建物
        for (const dep of area.departures ?? []) {
          const name = DEPARTURE_NAME[dep.id] ?? dep.id;
          const poly = svgEl("polygon", { class: "dep", points: dep.points, tabindex: 0, role: "button", "aria-label": `${name}から帰る（はまこく Exp. のルート検索へ）` });
          poly.addEventListener("click", () => select({ kind: "dep", area: area.id, id: dep.id }));
          poly.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select({ kind: "dep", area: area.id, id: dep.id }); } });
          overlay.appendChild(poly);
          u.deps.set(dep.id, poly);
          const [x0, y0, x1] = dep.bbox;
          // 建物の上の辺の中ほどに、文字の下の中央が来るようにする
          const label = el("div", { class: "dep-label", "aria-hidden": "true" }, el("span", { text: DEPARTURE_SHORT[dep.id] ?? name }));
          markers.appendChild(label);
          u.depLabels.push({ id: dep.id, node: label, x: (x0 + x1) / 2, y: y0 });
        }

        // バス停（#53）。地図の SVG の中のバス停は <object> 越しで触れないので、焼き込んだ位置に印を重ねる
        for (const stop of area.busStops ?? []) {
          const node = el("button", { type: "button", class: "stop", "aria-label": `${stop.name}の発車時刻`, title: `${stop.name}の発車時刻` });
          node.innerHTML = STOP_SVG;
          node.append(el("span", { class: "name", text: stop.name }));
          node.addEventListener("click", () => select({ kind: "stop", area: area.id, id: stop.name }));
          markers.appendChild(node);
          u.stops.push({ node, x: stop.x, y: stop.y, name: stop.name });
        }

        // 駅（#186）。事業者ごとに1つ。座標は odpt:Station のものを ports.json に焼いてある
        for (const station of area.stations ?? []) {
          const node = el("button", { type: "button", class: "station", "aria-label": `${station.name}の発車時刻`, title: `${station.name}の発車時刻` });
          const lead = el("i", { class: "lead", hidden: true });
          const glyph = el("span", { class: "glyph" });
          glyph.innerHTML = TRAIN_SVG;
          const mark = el("span", { class: "mark" }, glyph, el("span", { class: "label", text: station.short ?? station.name }));
          node.append(lead, mark);
          node.addEventListener("click", () => select({ kind: "station", area: area.id, id: station.id }));
          markers.appendChild(node);
          const { x, y } = project(station, area);
          u.stations.push({ node, mark, lead, x, y, id: station.id, name: station.name, dy: 0 });
        }

        // 駅の出口（#192）。押すと名前が出る（広い画面では出しっぱなし）。
        // 欄は作らない。出せるのは名前だけで、欄にするほどの中身が無いため
        for (const exit of area.exits ?? []) {
          const node = el("button", { type: "button", class: "exit", "aria-label": exit.name, title: exit.name });
          node.innerHTML = EXIT_SVG;
          // 三角は下向きに描いてあるので、方位 180 度ぶんを引いた角度だけ回す
          if (typeof exit.bearing === "number") node.firstChild.style.transform = `rotate(${exit.bearing - 180}deg)`;
          node.append(el("span", { class: "name", text: exit.short ?? exit.name }));
          node.addEventListener("click", () => {
            // 選んでいる印は1つだけにする。地図の選択（state.sel）とは別の、この層だけの見せ方
            const already = node.classList.contains("on");
            for (const other of u.exits) other.node.classList.remove("on");
            node.classList.toggle("on", !already);
          });
          markers.appendChild(node);
          const { x, y } = project(exit, area);
          u.exits.push({ node, x, y, name: exit.name });
        }

        // ポート。番号は ports.json の並び順（一覧と同じ）
        area.ports.forEach((port, i) => {
          const { x, y } = project(port, area);
          const node = el("div", { class: port.usedByHamakokuex ? "pin key" : "pin", "data-port": port.id });
          const num = el("span", { class: "pin-num", text: String(i + 1), "aria-hidden": "true" });
          const lead = el("span", { class: "pin-lead", hidden: true });
          const tag = el("span", { class: "pin-tag" });
          node.append(lead, num, tag);
          node.addEventListener("mouseenter", () => setActive(port.id, true));
          node.addEventListener("mouseleave", () => setActive(port.id, false));
          node.addEventListener("click", () => {
            const row = document.querySelector(`.port-row[data-port="${CSS.escape(port.id)}"]`);
            if (!row || KIOSK) return;
            setActive(port.id, true);
            row.scrollIntoView({ block: "nearest", behavior: "smooth" });
            setTimeout(() => setActive(port.id, false), 1600);
          });
          markers.appendChild(node);
          u.pins.push({ node, num, tag, lead, x, y, port, n: i + 1 });
        });

        // 走っているバスの層は fetchBuses() が描く
        return viewport;
      }

      // 地図のピンの札を、いまの台数と「使うアプリ」で描き直す
      function renderPins() {
        for (const area of data.areas) {
          const u = ui.get(area.id);
          for (const p of u.pins) {
            const ops = shownOps(p.port);
            // 選んだアプリで使えないポートは、地図からも一覧からも外す
            p.node.style.display = ops.length ? "" : "none";
            p.tag.textContent = "";
            const title = [`${p.n}. ${p.port.displayName}`];
            if (isReturnArea(area)) {
              // 返す側は「返せる空き」を1つだけ出す。空きは HELLO CYCLING の値が
              // 両社あわせた実際の空きなので、事業者ごとに割らない（returnInfo）。
              // どちらの事業者でも返せることは札の色（黄・赤）で示す
              p.tag.append(el("span", { class: "what", text: "空き" }));
              const info = returnInfo(p.port, ops);
              const chip = el("span", { class: "chip" });
              if (info.kind === "none") { chip.classList.add("na"); chip.textContent = "−"; }
              else if (info.kind === "closed") { chip.classList.add("zero"); chip.textContent = "不可"; }
              else if (info.kind === "unlimited") { chip.classList.add("plain"); chip.append("あり", opsMark(ops)); }
              else if (info.value === 0) { chip.classList.add("zero"); chip.append("0", el("small", { text: "台" })); }
              else { chip.classList.add("plain"); chip.append(String(info.value), el("small", { text: "台" }), opsMark(ops)); }
              title.push(info.kind === "none" ? "空き状況を取得できません"
                : info.kind === "closed" ? "現在返却不可"
                : info.kind === "unlimited" ? "返却枠に制限なし（何台でも返せます）"
                : `返せる空き ${info.value} 台`);
              for (const op of ops) {
                const st = statusFor(p.port, op);
                title.push(canRent(st)
                  ? `${operatorLabel(op)}: 借りられる自転車 ${st?.num_bikes_available ?? "−"} 台`
                  : `${operatorLabel(op)}: 現在貸出不可`);
              }
              p.tag.append(chip);
            } else {
              p.tag.insertAdjacentHTML("beforeend", BIKE_SVG);
              for (const op of ops) {
                const st = statusFor(p.port, op);
                const chip = el("span", { class: "chip" });
                if (!st) {
                  chip.classList.add("na");
                  chip.textContent = "−";
                  title.push(`${operatorLabel(op)}: 台数を取得できません`);
                } else if (!canRent(st)) {
                  // 利用時間外などで貸出が止まっている（#201）
                  chip.classList.add("zero");
                  chip.textContent = "不可";
                  title.push(`${operatorLabel(op)}: 現在貸出不可`);
                } else {
                  const n = st.num_bikes_available;
                  chip.classList.add(n === 0 ? "zero" : op);
                  chip.append(String(n ?? "?"), el("small", { text: "台" }));
                  title.push(`${operatorLabel(op)}: 借りられる自転車 ${n ?? "?"} 台`);
                }
                p.tag.append(chip);
              }
            }
            p.node.title = title.join("\n");
          }
          u.laidOutAt = null;
          positionMarkers(area.id);
        }
      }

      // ピンと一覧の行を同時に目立たせる
      function setActive(id, on) {
        document.querySelectorAll(`[data-port="${CSS.escape(id)}"]`).forEach((e) => e.classList.toggle("active", on));
      }

      // ---- 操作の欄 ----

      function segButton(label, pressed, onClick, iconHtml) {
        const node = el("button", { type: "button", class: "seg", "aria-pressed": String(pressed), onclick: onClick });
        if (iconHtml) {
          const ico = el("span", { class: "ico", "aria-hidden": "true" });
          ico.innerHTML = iconHtml;
          node.append(ico);
        }
        node.append(label);
        return node;
      }

      /**
       * 「地図に出す」の見本（#197）。地図の印と同じ形を添えて、どれを消しているかを分かるようにする。
       * バスは丸の中にマークを置いているが、ここでは枠のぶんが小さすぎるのでマークだけにする
       */
      const LAYER_ICON = {
        ports: BIKE_SVG,
        stops: STOP_SVG,
        buses: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a2 2 0 0 1 2 2v12H4V5a2 2 0 0 1 2-2zM4 11h16M7 17v3M17 17v3"/></svg>',
        stations: TRAIN_SVG,
        exits: EXIT_SVG,
      };

      function renderControls() {
        const box = document.getElementById("controls");
        box.textContent = "";
        box.append(
          el("span", { class: "label", id: "lbl-layers", text: "地図に出す" }),
          el("div", { class: "opts", role: "group", "aria-labelledby": "lbl-layers" },
            ...[["ports", "シェアサイクル"], ["stops", "バス停"], ["buses", "バス"], ["stations", "鉄道情報"], ["exits", "出口"]]
              // そのエリアに無いものは切り替えを出さない（横浜駅にバス停は無い、#202）
              .filter(([k]) => (k !== "buses" || busAvailable) && (k !== "stations" || trainsAvailable)
                && (k !== "exits" || (areaById.get(state.area).exits ?? []).length)
                && (k !== "stops" || (areaById.get(state.area).busStops ?? []).length))
              .map(([k, label]) => segButton(label, state.layers[k], () => toggleLayer(k), LAYER_ICON[k]))),
          el("span", { class: "label", id: "lbl-op", text: "使うアプリ" }),
          el("div", { class: "opts", role: "group", "aria-labelledby": "lbl-op" },
            ...OP_CHOICES.map((op) => segButton(op === "both" ? "両方" : operatorLabel(op), state.op === op, () => setOp(op)))),
        );
        // エリアの切り替えは地図の上（#197）。展示モードは右上の別の枠を使う
        for (const id of ["area-tabs", "kiosk-areas"]) {
          const box = document.getElementById(id);
          box.textContent = "";
          for (const a of data.areas) box.append(segButton(AREA_TAB[a.id] ?? a.name, state.area === a.id, () => setArea(a.id)));
        }
      }

      // はまこく Exp. の返却先を示す「輪つきの番号」の見本（#198）
      function keyPinSwatch() {
        const s = el("span", { class: "pin key" });
        s.style.cssText = "position: relative; width: 22px; height: 22px; display: inline-block";
        const n = el("span", { class: "pin-num", text: "1" });
        n.style.cssText = "left: 2px; top: 2px; width: 18px; height: 18px";
        s.append(n);
        return s;
      }

      // 「くわしく」に出す、データごとの取得時刻の表（#220。ODPT ガイドライン 2.1.1・2.2.1）。
      // 動的データ（台数・位置・遅れ）は生成時刻（時点）、時刻表は取得日時
      function dataTimeRows() {
        const rows = [];
        const CYCLE_NAMES = { hellocycling: "HELLO", docomo: "ドコモ" };
        for (const op of Object.keys(STATUS_FEEDS)) {
          const at = realtime[op]?.lastUpdated;
          rows.push([`シェアサイクル(${CYCLE_NAMES[op] ?? operatorLabel(op)})`, "シェアサイクル事業者のデータ（GBFS）", asOf(at) ? `${asOf(at)} 時点` : "−"]);
        }
        // 位置と遅れは同じ上流（odpt:Bus）を別々に取るので、時刻がずれうる。古いほうを出す（新しく見せない）
        const trainLines = (trains?.operators ?? []).flatMap((op) => op.lines);
        const busLive = asOf(oldestOf([busAvailable ? busReportedAt : null, timetable?.delayAsOf]));
        rows.push(["バスリアルタイム情報", "ODPT 市営バスの位置情報", busLive ? `${busLive} 時点` : "−"]);
        // 相鉄バス・神奈中バスの時刻表は仮データのあいだは出さない（取得日時は記録している）
        const busTimetable = asOf(timetable?.timetableAsOf?.municipal);
        rows.push(["バス時刻表情報", "ODPT 市営バスの時刻表", busTimetable ? `${busTimetable} 取得` : "−"]);
        const trainLive = asOf(oldestOf(trainLines.flatMap((l) => [l.delayAsOf, l.infoAsOf])));
        rows.push(["鉄道リアルタイム情報", "ODPT 列車の位置・運行情報", trainLive ? `${trainLive} 時点` : "−"]);
        const trainTimetable = asOf(oldestOf(trainLines.map((l) => l.timetableFetchedAt)));
        rows.push(["鉄道時刻表情報", "ODPT 駅時刻表", trainTimetable ? `${trainTimetable} 取得` : "−"]);
        return rows;
      }

      function fillDataTimes() {
        const tbody = document.getElementById("data-times-body");
        if (!tbody) return;
        tbody.textContent = "";
        for (const [name, source, at] of dataTimeRows()) {
          tbody.append(el("tr", {}, el("td", { text: name }), el("td", { text: source }), el("td", { class: "num", text: at })));
        }
      }

      let updatedAtText = ""; // 展示モードの凡例の先頭に出す「HH:mm 更新」
      function renderLegend() {
        const area = areaById.get(state.area);
        const ul = document.getElementById("legend");
        ul.textContent = "";
        const items = [];
        // 返す側は数字の塗りを揃えて事業者を印で示すので、凡例も印にそろえる。
        // はまこく Exp. の返却先（輪つきの番号）は、注釈を付けずに行の右端へ置く（#198）
        if (isReturnArea(area)) {
          // はまこく Exp. の返却先（輪つきの番号）は、注釈を付けずに行の左端へ置く（#198）
          const row = el("li", {});
          if (area.ports.some((p) => p.usedByHamakokuex)) row.append(keyPinSwatch());
          row.append(opsMark(OPERATORS), "返却可能なポート");
          items.push(row);
        } else {
          items.push(el("li", {},
            el("span", { class: "chip hellocycling", text: "黄" }), el("span", { class: "chip docomo", text: "赤" }),
            "利用可能台数（HELLO・ドコモ）"));
        }
        if ((area.busStops ?? []).length) {
          const s = el("span"); s.innerHTML = STOP_SVG;
          items.push(el("li", {}, s, "バス停"));
        }
        if ((area.exits ?? []).length) {
          const s = el("span", { class: "exit" });
          s.style.cssText = "position: relative; display: inline-block; width: 14px; height: 13px";
          s.innerHTML = EXIT_SVG;
          s.firstChild.style.cssText = "left: 1px; top: 1px";
          items.push(el("li", {}, s, "横浜駅の出口"));
        }
        if (trainsAvailable && (area.stations ?? []).length) {
          const s = el("span", { class: "glyph" });
          s.innerHTML = TRAIN_SVG;
          items.push(el("li", {}, s, "鉄道情報"));
        }
        if (busAvailable) {
          const s = el("span", { class: "bus" });
          s.style.cssText = "position: relative; display: inline-block; margin: 0; width: 22px; height: 22px";
          const b = el("span", { class: "body" }); b.style.inset = "3px"; b.innerHTML = BUS_GLYPH;
          s.append(b);
          // 台数そのものに意味は薄い。#84 の目的は「0台」と「取得失敗」の言い分けなので、
          // 取れたかどうかだけを小さく添える（#198）
          // 展示モードは短い名前で、取得の成否は出さない
          items.push(el("li", {}, s, KIOSK ? "市営バス位置情報" : "リアルタイム位置情報（市営バスのみ）",
            !KIOSK && busStatus ? el("small", { class: "note", text: BUS_STATUS_LABEL[busStatus] }) : null));
        }
        // 展示モードは触らせないので、操作の案内は出さない（#187）
        if (!KIOSK) items.push(el("li", { class: "muted", text: "ドラッグで移動・ピンチで拡大・タップで詳細" }));
        // 展示モードは、凡例の先頭に更新時刻を小さく出す
        if (KIOSK && updatedAtText) items.unshift(el("li", { class: "muted lg-updated", text: updatedAtText }));
        // データの時点は「くわしく」の表にまとめる（#220。ODPT ガイドライン 2.1.1）。
        // 展示モードは「くわしく」を出さないので、凡例に短くまとめて出す（触れない画面でも読めるように）
        if (KIOSK) {
          // 一項目を一行に（遠目でも読めるように、まとめない）。取れていない行は出さない
          // 名前と時刻は 2 列に分けて、時刻の頭を揃える
          for (const [name, , at] of dataTimeRows()) {
            if (at !== "−") items.push(el("li", { class: "muted lg-time" }, el("span", { text: name }), el("span", { text: at })));
          }
        }
        // 展示モードは、記号の列を固定幅にして、説明の頭を揃える
        if (KIOSK) {
          for (const li of items.filter(Boolean)) {
            if (li.classList.contains("muted")) continue;
            const nodes = [...li.childNodes];
            const iconCount = nodes.findIndex((n) => n.nodeType !== 1 || n.tagName === "SMALL");
            if (iconCount <= 0) continue;
            const icon = el("span", { class: "lg-icon" });
            icon.append(...nodes.slice(0, iconCount));
            const text = el("span", { class: "lg-text" });
            text.append(...nodes.slice(iconCount));
            li.append(icon, text);
          }
        }
