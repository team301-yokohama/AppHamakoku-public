        ul.append(...items.filter(Boolean));
        fillDataTimes();
      }

      // ---- ポートの一覧 ----

      /**
       * 借りられる台数（#199）。事業者名は書かず、色の印で示す（黄＝HELLO、赤＝ドコモ）。
       *
       * 数字を色の中に入れると、2つ並んだときに「3」「2」が「32」の一つの数に見えるので、
       * 印は数字の**横**に置く。色だけに頼らないよう、読み上げ用の名前は title に残す
       */
      function countEl(op, value, big, renting = true) {
        const label = SHORT_LABEL[op] ?? op;
        const mark = el("i", { class: op });
        // 利用時間外などで貸出が止まっているときは、数字ではなく「不可」と出す（#201）
        if (!renting) return el("span", { class: "count closed", title: `${label} 現在貸出不可` }, mark, el("b", { text: "不可" }));
        if (value === null) return el("span", { class: "count na", title: `${label} 台数不明` }, mark, el("b", { text: "−" }));
        // 空きと同じく、台数も負で来ることがありうる（#206）。負は 0 として出す
        const n = Math.max(0, value);
        return el("span", { class: `count${n === 0 ? " zero" : ""}${big ? " big" : ""}`, title: `${label} ${n}台` },
          mark, el("b", { text: String(n) }));
      }

      /**
       * よく使うバス停の欄（#146）。覚えている停留所の「次の1本」を並べる。
       * 押すと、ふだんの時刻表の欄（renderStopPanel）が開く
       */
      function renderFavorites() {
        const box = document.getElementById("favorites");
        box.textContent = "";
        const names = state.favorites;
        box.hidden = KIOSK || !names.length;
        if (box.hidden) return;

        box.append(el("div", { class: "list-head" }, el("h2", { text: "よく使うバス停" })));
        if (!timetable) {
          box.append(el("p", { class: "panel-empty", text: timetableError ? "この環境では時刻表を表示できません。" : "時刻表を取得中…" }));
          return;
        }
        const now = nowMinutes();
        for (const name of names) {
          const all = (timetable.stops && timetable.stops[name]) || [];
          const next = all.find((d) => toMinutes(d.time) + (d.delay ?? 0) >= now);
          // 行そのものを押すと時刻表が開く。右端の ✕ で一覧から外す。
          // ボタンの入れ子は作れないので、行は div にして中に2つ置く
          const open = el("button", { type: "button", class: "open", "aria-label": `${name}の発車時刻を開く` },
            el("span", { class: "name", text: name }));
          if (next) {
            const left = toMinutes(next.time) + (next.delay ?? 0) - now;
            open.append(
              el("span", { class: "t", text: next.time.length === 4 ? `0${next.time}` : next.time }),
              el("span", { class: "left", text: left <= 0 ? "まもなく" : `あと${left}分` }));
          } else {
            open.append(el("span", { class: "t muted", text: "—" }), el("span", { class: "left muted", text: "本日は終了" }));
          }
          // どのエリアの停留所かを探して、その地図に切り替えてから開く
          open.addEventListener("click", () => {
            const area = data.areas.find((a) => (a.busStops ?? []).some((st) => st.name === name));
            if (!area) return;
            if (area.id !== state.area) setArea(area.id);
            select({ kind: "stop", area: area.id, id: name });
          });
          box.append(el("div", { class: "fav-row" }, open,
            el("button", { type: "button", class: "drop", "aria-label": `${name}をよく使うから外す`, title: "よく使うから外す", text: "✕",
              onclick: () => toggleFavorite(name) })));
        }
        box.append(el("p", { class: "panel-foot", text: "時刻表の欄の「よく使う」で増やせます" }));
      }

      function renderList() {
        const area = areaById.get(state.area);
        const box = document.getElementById("port-list");
        box.textContent = "";
        const ret = isReturnArea(area);
        box.append(el("div", { class: "list-head" },
          el("h2", { text: "シェアサイクルのポート一覧" })));

        area.ports.forEach((port, i) => {
          const ops = shownOps(port);
          if (!ops.length) return;
          const info = returnInfo(port, ops);
          // 「満」も数字と同じ大きさで出す（小さいと見落とす、#199）
          const bigDock = (body, cls) => el("span", { class: `dock big${cls ? ` ${cls}` : ""}` }, "返す 空き", el("b", { text: body }), opsMark(ops));
          const dock =
            info.kind === "none" ? el("span", { class: "dock muted", text: "返す: −" })
            : info.kind === "closed" ? (ret ? bigDock("不可", "full") : el("span", { class: "dock full", text: "返却：現在不可" }))
            : info.kind === "unlimited" ? (ret ? bigDock("あり") : el("span", { class: "dock", text: "返す: 空きあり" }))
            : info.value === 0 ? (ret ? bigDock("満", "full") : el("span", { class: "dock full", text: "返す: 満" }))
            : ret ? bigDock(String(info.value))
            : el("span", { class: "dock", text: `返す: 空き ${info.value}` });
          // 借りられる台数は、事業者名を書かずに色のチップで示す（「HELLO 3」は読みにくい、#199）。
          // 色の意味は凡例（黄＝HELLO、赤＝ドコモ）に書いてある
          const counts = el("div", { class: "row" },
            ret ? el("span", { class: "lead", text: "借りる" }) : null,
            ...ops.map((op) => {
              const st = statusFor(port, op);
              return countEl(op, st ? (st.num_bikes_available ?? null) : null, !ret && state.op !== "both", canRent(st));
            }));
          const sub = [port.usedByHamakokuex ? "はまこく Exp. の返却先" : null, port.availableOperators.length < OPERATORS.length ? `${operatorLabel(port.availableOperators[0])} のみ` : null].filter(Boolean).join("・");
          const row = el("div", { class: `port-row${port.usedByHamakokuex ? " key" : ""}`, "data-port": port.id },
            el("span", { class: "n", text: String(i + 1), "aria-hidden": "true" }),
            el("div", {}, el("span", { class: "name", text: port.displayName }), sub ? el("span", { class: "sub", text: sub }) : null),
            el("div", { class: "counts" }, ...(ret ? [dock, counts] : [counts, dock])));
          row.addEventListener("mouseenter", () => setActive(port.id, true));
          row.addEventListener("mouseleave", () => setActive(port.id, false));
          box.append(row);
        });

        box.append(renderMore(area));
      }

      /**
       * 文の中の一部を太字にする（#199）。免責は読み飛ばされやすいので、肝だけ強くする
       * @param {(string | Node)[]} parts
       */
      function strongText(text) {
        return el("strong", { text });
      }

      /**
       * 情報の正しさについての断り書き（#199・#204）。「くわしく」とページの下の両方で使う。
       * 読み飛ばされやすいので、肝のところだけ太字にする。
       * 「こちら」はこのページの報告の欄を開く（#204）。止めているときは押せない文字のまま出す
       * @param {(string | Node)[]} lead - 前置き（文面が2か所で違う）
       */
      function disclaimerParts(...lead) {
        return [
          ...lead,
          "ご利用の場合は", strongText("必ず事業者の公式アプリなどの情報をご参照"), "ください。",
          "情報に誤りがある場合は",
          el("strong", {}, "事業者へのお問い合わせはお控えいただき、",
            reportButton("こちら", "other", () => reportContext()) ?? "こちら",
            "から team301 にご連絡ください。"),
        ];
      }

      // 定員・共用の説明・数字の読み方は「くわしく」に畳む（#177・#199）
      function renderMore(area) {
        const details = el("details", { class: "more" });
        details.append(el("summary", { text: "くわしく（共用・定員・数字の読み方・取得時刻）" }));
        details.append(el("p", { class: "notice" },
          ...disclaimerParts("表示される情報は実際の状況と異なる場合があります。"),
          // 免責事項はアプリ共通のページ（#226）。ページの下にもリンクがあるので、ここ（くわしく）にだけ添える
          "（", el("a", { href: "/disclaimer" }, "免責事項・クレジット"), "）"));

        const shared = area.ports.filter((p) => p.availableOperators.length > 1);
        if (shared.length) {
          details.append(el("p", { text: "構内のポートは HELLO CYCLING とドコモ・バイクシェアが共同で利用可能です。（2026年10月現在）" }));
          const ul = el("ul", { class: "plain" },
            el("li", {}, strongText("貸出の場合："), "利用可能台数が事業者ごとに分かれているため、どちらか一方のみ利用の場合にご注意ください。"),
            el("li", {}, strongText("返却の場合："), "返却可能台数は事業者によらず共通です。"));
          details.append(ul);
        }

        const dl = el("dl");
        for (const [t, d] of [
          ["−", "台数を取得できていない（取得中・取得できなかった・その事業者のデータに無い）"],
          ["満", "返却できる空きなし"],
          ["空きあり", "返却台数に制限がないポート"],
          ["不可", "利用時間外などで現在貸出不可（返却不可の場合は「返却：現在不可」）"],
        ]) dl.append(el("dt", { text: t }), el("dd", { text: d }));
        details.append(dl);

        const table = el("table");
        table.append(el("thead", {}, el("tr", {}, el("th", { text: "ポート" }), el("th", { text: "定員" }))));
        const tbody = el("tbody");
        area.ports.forEach((port, i) => {
          tbody.append(el("tr", {},
            el("td", { text: `${i + 1}. ${port.displayName}${port.note ? `（${port.note}）` : ""}` }),
            el("td", { class: "num", text: isUnlimitedReturn(port) ? "無制限" : `${port.capacity ?? "不明"}台` })));
        });
        table.append(tbody);
        details.append(table);
        // データごとの取得時刻（#220）。値は renderLegend → fillDataTimes で埋める。取得のたびに描き直される
        details.append(el("p", { class: "muted", text: "データごとの取得時刻" }));
        const timesTable = el("table");
        timesTable.append(el("thead", {}, el("tr", {}, el("th", { text: "データ" }), el("th", { text: "取得元" }), el("th", { text: "時刻" }))));
        timesTable.append(el("tbody", { id: "data-times-body" }));
        details.append(timesTable);
        const updated = new Date(data.updatedAt);
        details.append(el("p", { class: "muted" },
          `ポートの位置・定員は ${isNaN(updated) ? data.updatedAt : updated.toLocaleDateString("ja-JP")} 時点のスナップショットです。`,
          reportButton("　ポートの情報を報告", "port-info", () => reportContext())));
        return details;
      }

      // ---- 押したもの（バス停・バス・出発地の建物）----

      /**
       * 展示モードで、選んだものを跳ねさせて輪を広げる（#189）。
       * 来場者は触らないので、めくったことを動きで知らせる。
       * 位置は placeMarker が transform で決めているので、跳ねるのは中身だけ（CSS 側）
       */
      function kioskPop(sel) {
        if (!KIOSK || !sel) return;
        const u = ui.get(sel.area);
        if (!u) return;
        const found = sel.kind === "stop" ? u.stops.find((s) => s.name === sel.id)
          : sel.kind === "bus" ? u.buses.find((b) => b.bus.id === sel.id)
            : sel.kind === "station" ? u.stations.find((st) => st.id === sel.id)
              : null;
        const target = found ?? (sel.kind === "dep" ? u.depLabels.find((d) => d.id === sel.id) : null);
        if (!target) return;
        // いったん外してから付け直さないと、同じ要素で2回目のアニメーションが始まらない。
        // 終わったら外す（付けっぱなしにすると、どれが今めくられたのか分からなくなる）
        target.node.classList.remove("pop");
        void target.node.offsetWidth;
        target.node.classList.add("pop");
        setTimeout(() => target.node.classList.remove("pop"), 700);

        // 広がる輪。建物（出発地）には出さない。輪は点を指すためのもので、
        // 面で塗ってある建物には合わない（#189）
        if (sel.kind === "dep") return;
        const ping = el("span", { class: "ping" }, el("i", {}));
        u.markers.appendChild(ping);
        placeMarker(ping, u.view, target.x, target.y);
        // 駅の印は重なりを避けて縦にずれていることがある。輪もその分だけ下げる（#194）
        if (sel.kind === "station" && target.dy) ping.style.marginTop = `${target.dy.toFixed(1)}px`;
        // バスは動いているので、輪も一緒に動かす。止まっているバス停はそのまま
        if (sel.kind === "bus") u.pings.push({ node: ping, of: target });
        const drop = () => {
          ping.remove();
          u.pings = u.pings.filter((p) => p.node !== ping);
        };
        ping.firstElementChild.addEventListener("animationend", drop);
        setTimeout(drop, 2000);
      }

      function select(sel) {
        const cur = state.sel;
        // 同じものをもう一度押したら閉じる
        if (cur && sel && cur.kind === sel.kind && cur.area === sel.area && cur.id === sel.id) sel = null;
        state.sel = sel;
        state.showAll = false;
        state.openDir = new Set();
        kioskPop(sel);
        // 選んだときだけ、選んだものが見えるところまで地図と画面を動かす。
        // 自動更新で描き直すときは動かさない（読んでいる途中で画面が飛ばないように）
        renderSelection(true);
        if (sel && sel.kind === "stop") loadTimetable().then(() => { renderSelection(); renderFavorites(); }, () => renderSelection());
        if (sel && sel.kind === "station") loadTrains().then(() => renderSelection(), () => renderSelection());
      }

      function closePanel() { select(null); }

      function panelHead(title, closeLabel) {
        return el("div", { class: "panel-head" },
          el("h2", { text: title }),
          el("button", { type: "button", class: "x", "aria-label": closeLabel, onclick: closePanel, text: "×" }));
      }

      function renderSelection(reveal = false) {
        const sel = state.sel;
        // 地図の印の「選んでいる」表示
        for (const [areaId, u] of ui) {
          for (const s of u.stops) s.node.classList.toggle("on", !!sel && sel.kind === "stop" && sel.area === areaId && sel.id === s.name);
          for (const b of u.buses) b.node.classList.toggle("on", !!sel && sel.kind === "bus" && sel.area === areaId && sel.id === b.bus.id);
          for (const st of u.stations) st.node.classList.toggle("on", !!sel && sel.kind === "station" && sel.area === areaId && sel.id === st.id);
          for (const [id, poly] of u.deps) poly.classList.toggle("on", !!sel && sel.kind === "dep" && sel.area === areaId && sel.id === id);
          // 建物の名前は別の層にあるので、同じ印を付けておく（展示モードで薄くする対象から外すため、#194）
          for (const d of u.depLabels) d.node.classList.toggle("on", !!sel && sel.kind === "dep" && sel.area === areaId && sel.id === d.id);
          // 展示モードでは、めくっているものと同じ種類のほかの印だけを薄くする
          u.viewport.dataset.focus = KIOSK && sel && sel.area === areaId ? sel.kind : "";
          if (u.callout) { u.callout.node.remove(); u.callout = null; }
        }

        const panels = document.getElementById("panels");
        panels.textContent = "";
        if (!sel) return;
        const area = areaById.get(sel.area);
        const u = ui.get(sel.area);

        if (sel.kind === "dep") {
          // 出発地の建物は、地図の上に吹き出しで出す（#179）
          const dep = (area.departures ?? []).find((d) => d.id === sel.id);
          if (!dep) return;
          const name = DEPARTURE_NAME[dep.id] ?? dep.id;
          const node = el("div", { class: "dep-callout", role: "dialog", "aria-label": `${name}から帰る` },
            el("b", { text: `${name}から帰る` }),
            el("a", { href: `${EXP_URL}?from=${encodeURIComponent(dep.id)}`, text: "横浜駅までの最速ルート →" }),
            el("button", { type: "button", class: "x", "aria-label": "閉じる", onclick: closePanel, text: "×" }));
          u.markers.appendChild(node);
          const [x0, y0, x1, y1] = dep.bbox;
          u.callout = { node, x: (x0 + x1) / 2, y: y0 };
          // 吹き出しは建物の上。幅の半分だけ左へずらし、枠からはみ出す分は戻す
          const w = node.offsetWidth;
          const h = node.offsetHeight;
          const sx = u.view.tx + u.callout.x * u.view.scale;
          const vpW = u.viewport.clientWidth;
          const left = clamp(sx - w / 2, 4, Math.max(4, vpW - w - 4)) - sx;
          node.style.marginLeft = `${left}px`;
          node.style.marginTop = `${-h - 10}px`;
          if (reveal) u.view.ensureVisible((x0 + x1) / 2, (y0 + y1) / 2, Math.min(h + 30, 140));
          placeMarker(node, u.view, u.callout.x, u.callout.y);
          return;
        }

        if (sel.kind === "stop") {
          const stop = u.stops.find((s) => s.name === sel.id);
          if (stop && reveal) u.view.ensureVisible(stop.x, stop.y, 50);
          panels.append(renderStopPanel(area, sel.id));
        } else if (sel.kind === "station") {
          const st = u.stations.find((x) => x.id === sel.id);
          if (st && reveal) u.view.ensureVisible(st.x, st.y, 50);
          panels.append(renderStationPanel(area, sel.id));
          // 幅が要るので、置いてから測る（#200）
          flowLongInfo(panels);
        } else if (sel.kind === "bus") {
          const b = u.buses.find((x) => x.bus.id === sel.id);
          if (!b) { state.sel = null; return; }
          if (reveal) u.view.ensureVisible(b.x, b.y, 50);
          panels.append(renderBusPanel(b.bus));
        }
        if (reveal && !KIOSK) panels.firstElementChild?.scrollIntoView({ block: "nearest" });
      }

      // ---- バス停の発車時刻（#53）と遅れ（#178）----
      //
      // 時刻表はどの事業者もキーが要るので、サーバからしか取れない。
      // 市営バスの便には、走っている位置から求めた遅れ（delay、分）が載る。相鉄バス・神奈中は位置が無いので null
      const TIMETABLE_API = "api/timetable";
      const BUS_OPERATOR_LABEL = { sotetsu: "相鉄バス", municipal: "市営バス", kanachu: "神奈中バス" };
      const UPCOMING_COUNT = 6;
      // サーバのキャッシュと同じ 60 秒。開いている間に遅れが変わるので取り直す
      const TIMETABLE_REFRESH_MS = 60 * 1000;

      let timetable = null;        // { date, stops: {...}, errors: [...] }
      let timetableAt = 0;
      let timetableError = false;
      let timetableLoading = null;

      function todayString() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }

      async function loadTimetable(force) {
        if (!force && timetable && Date.now() - timetableAt < TIMETABLE_REFRESH_MS && timetable.date === todayString()) return timetable;
        if (!timetableLoading) {
          timetableLoading = (async () => {
            try {
              const res = await fetch(`${TIMETABLE_API}?date=${todayString()}`, { cache: "no-store" });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              timetable = await res.json();
              noteDemo(timetable);
              timetableAt = Date.now();
              timetableError = false;
              renderLegend();
            } catch (error) {
              // 口が無い（静的配信）・落ちている。前に取れたものがあればそれを出し続ける
              if (!timetable) timetableError = true;
            }
            return timetable;
          })().finally(() => { timetableLoading = null; });
        }
        return timetableLoading;
      }

      // 「HH:mm」を分に直す。24 時を超える表記（25:10）もそのまま扱う
      function toMinutes(t) {
        const [h, m] = t.split(":").map(Number);
        return h * 60 + m;
      }
      // 0:00〜3:59 は前日ダイヤの 24:00〜27:59 として比べる（spec 4章と同じ扱い）
      function nowMinutes() {
        const d = new Date();
        const m = d.getHours() * 60 + d.getMinutes();
        return d.getHours() < 4 ? m + 24 * 60 : m;
      }

      function renderStopPanel(area, stopName) {
        const sec = el("section", { class: "panel", "aria-label": `${stopName}の発車時刻` });
        const head = panelHead(`${stopName}　横浜駅方面`, "時刻を閉じる");
        // よく使うバス停（#146）。展示モードでは覚えさせない
        if (!KIOSK) {
          const on = isFavorite(stopName);
          head.insertBefore(el("button", {
            type: "button",
            class: on ? "fav-toggle on" : "fav-toggle",
            "aria-pressed": String(on),
            title: on ? "よく使うから外す" : "よく使うに入れる",
            text: on ? "★ よく使う" : "☆ よく使う",
            onclick: () => toggleFavorite(stopName),
          }), head.lastElementChild);
        }
        sec.append(head);

        if (!timetable) {
          sec.append(el("p", { class: "panel-empty", text: timetableError
            ? "この環境では時刻表を表示できません。"
            : "時刻表を取得中…" }));
          return sec;
        }
        const all = (timetable.stops && timetable.stops[stopName]) || [];
        if (!all.length) {
          // 「持っていない停留所」と「今日は走らない停留所」はサーバの応答から言い分けられないので、分かることだけ書く
          sec.append(el("p", { class: "panel-empty", text: `${timetable.date} のダイヤでは、この停留所から横浜駅方面の便はありません。` }));
          return sec;
        }

        const now = nowMinutes();
        // これからの便は、遅れを足した見込みで「まだ来ていない」ものを出す
        const upcoming = all.filter((d) => toMinutes(d.time) + (d.delay ?? 0) >= now);
        const list = state.showAll ? all : upcoming.slice(0, UPCOMING_COUNT);
        if (!list.length) {
          sec.append(el("p", { class: "panel-empty", text: "本日の横浜駅方面の運行は終了しました。" }));
        }
        for (const d of list) {
          const op = BUS_OPERATOR_LABEL[d.operator] ?? d.operator;
          // 遅れを出せるのは市営バスだけ（相鉄バス・神奈中は車両位置を配信していない）。
          // 足の注釈ではなく、便ごとに「非対応」と出す（#200）
          const line = { delayAvailable: d.operator === "municipal" };
          const left = toMinutes(d.time) + (d.delay ?? 0) - now;
          const leftText = left < 0 ? "発車済み" : left === 0 ? "まもなく" : `あと${left}分`;
          sec.append(el("div", { class: "dep-row" },
            el("span", { class: "t", text: d.time.length === 4 ? `0${d.time}` : d.time }),
            el("span", { class: "what" }, [d.route, "横浜駅方面"].filter(Boolean).join(" "),
              el("small", { text: [op, d.isMidnight ? "深夜" : null].filter(Boolean).join("・") })),
            el("span", { class: "left" }, leftText, delayNode(line, d, left))));
        }

        const foot = el("p", { class: "panel-foot" },
          el("button", { type: "button", class: "link", onclick: () => { state.showAll = !state.showAll; renderSelection(); }, text: state.showAll ? "これからの便" : "当日の全便" }),
          `　／　${timetable.date} のダイヤ`,
          reportButton("　／　この時刻を報告", "wrong-time", () => reportContext()));
        sec.append(foot);
        return sec;
      }

      // ---- 駅の発車時刻（#186）----
      //
      // 横浜駅から出る電車。路線ごとに次の3本を、方向ごとに出す。
      // 絞り込みはサーバでやっているので、ここは描くだけ（1駅1方向で 110〜330 本あるため）。
      // 取れるものが路線で違うので、路線ごとの印（delayAvailable / infoAvailable）を見て言い分ける
      const TRAINS_API = "api/trains";
      // サーバのキャッシュと同じ 60 秒。開いている間に遅れと「いまどのあたり」が変わる
      const TRAINS_REFRESH_MS = 60 * 1000;

      let trains = null;           // { date, calendar, operators: [...], errors: [...] }
      let trainsAt = 0;
      let trainsError = false;
      let trainsLoading = null;
      // 口が無い（静的配信）・チャレンジ API のキーが無い（#100）と分かったら、駅の印ごと畳む
      let trainsAvailable = true;

      async function loadTrains(force) {
        if (!trainsAvailable) return null;
        // file:// で開いたときは口が無いと分かりきっている。バスと同じく、駅の表示ごと畳む
        if (location.protocol === "file:") { trainsAvailable = false; return null; }
        if (!force && trains && Date.now() - trainsAt < TRAINS_REFRESH_MS && trains.date === todayString()) return trains;
        if (!trainsLoading) {
          trainsLoading = (async () => {
            try {
              const res = await fetch(`${TRAINS_API}?date=${todayString()}`, { cache: "no-store" });
              // 404（静的配信）・503（サーバにキーが無い）は、待っても出ないので畳む
              if (res.status === 404 || res.status === 503) { trainsAvailable = false; return null; }
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              trains = await res.json();
              noteDemo(trains);
              trainsAt = Date.now();
              trainsError = false;
              renderLegend();
            } catch (error) {
              // 落ちている。前に取れたものがあればそれを出し続ける
              if (!trains) trainsError = true;
            }
            return trains;
          })().finally(() => { trainsLoading = null; });
        }
        return trainsLoading;
      }

      // 駅の時刻表は 24 時超え表記を使わず「00:07」で来る。0〜3時台は翌日ぶんとして比べる
      function toMinutesTrain(t) {
        const [h, m] = t.split(":").map(Number);
        return (h < 4 ? h + 24 : h) * 60 + m;
      }

      /**
       * 路線ごとの運行情報（#200）。出し方は3つだけにする。
       * - 配信がない路線（京急・相鉄）… 「運行情報：−」（灰色の囲み）
       * - 平常 … 「運行情報：平常運転」（青の囲み）。事業者で文面が違う（東急は長い）ので言い方をそろえる
       * - それ以外 … 配信された文面をそのまま赤の囲みで出す（遅れと見合わせを自前で判別しない）
       */
      function lineInfoNode(line) {
        // 「運行情報：」は動かさず、本文だけを送る。
        // 電光掲示板のように一方向へ送るので、同じ本文を2つ並べた帯にする。
        // 1つ目が左へ抜けるのと入れ替わりに2つ目が入るので、切れ目なく回る
        const box = (tone, text) => el("span", { class: `info ${tone}` },
          el("span", { class: "label", text: "運行情報：" }),
          el("span", { class: "body" },
            el("span", { class: "track" },
              el("span", { class: "text", text }),
              el("span", { class: "text dup", text, "aria-hidden": "true" }))));
        if (!line.infoAvailable || !line.info) return box("none", "非対応");
        return line.info.normal ? box("ok", "平常運転") : box("bad", line.info.text);
      }

      /**
       * 入りきらない運行情報を、折り返さずにゆっくり流す（#200）。
       *
       * 本文は長い（実例 46 字）。2行にすると欄が間延びするので、1行のまま端まで送って
       * 戻す。入りきるもの（「平常運転」など）は動かさない。
       * 速さは 1 秒 30px にそろえ、前後で 1.6 秒ずつ止めて読む間をつくる。
       * 動きを控えめにする設定のときは、CSS 側で折り返しに戻す
       *
       * @param {Element} root - 測る前に DOM へ入れてあること（幅が要るため）
       */
      function flowLongInfo(root) {
        const GAP = 32;    // 2つ目の文との間。詰まって見えない程度に空ける
        const SPEED = 35;  // 1 秒に送る px
        for (const info of root.querySelectorAll(".info")) {
          const body = info.querySelector(".body");
          const text = info.querySelector(".text");
          if (!body || !text) continue;
          info.classList.remove("flow");
          // 動かすのは本文だけ。「運行情報：」の札は外にあるので、幅は .body で測る
          const inner = () => body.clientWidth;
          if (text.getBoundingClientRect().width <= inner() + 1) continue;
          // 流すと決めたときだけ幅の下限が効くので、付けてから測り直す
          info.classList.add("flow");
          const width = text.getBoundingClientRect().width;
          if (width <= inner() + 1) { info.classList.remove("flow"); continue; }
          info.style.setProperty("--shift", `${Math.round(width + GAP)}px`);
          info.style.setProperty("--dur", `${((width + GAP) / SPEED).toFixed(1)}s`);
        }
      }

      /**
       * 便ごとの遅れ（#200）。配信がない路線は「非対応」と出す。
       * 足の注釈に書いても見落とされるので、便の横に出す
       */
      function delayNode(line, d, left) {
        const small = { class: "muted", style: "display: block; font-size: 11px; font-weight: 400" };
        if (!line.delayAvailable) return el("span", { ...small, text: "（非対応）" });
        if (d.delay > 0) return el("span", { class: "late", text: `${d.delay}分遅れ` });
        if (d.delay === 0 && left >= 0) return el("span", { ...small, text: "定刻" });
        return null;
      }

      /**
       * 駅の欄の1便ぶん。toggle を渡すと、押して残りを開け閉めする行になる（#186）
       * @param {object} line - 路線（遅れを出せるかの判定に使う）
       * @param {object} d - 1便
       * @param {number} now - いまの分
       * @param {{key: string, open: boolean} | null} toggle
       */
      function departureRow(line, d, now, toggle) {
        const left = toMinutesTrain(d.time) + (d.delay ?? 0) - now;
        const leftText = left < 0 ? "発車済み" : left === 0 ? "まもなく" : `あと${left}分`;
        // 走行中の列車は緯度経度を持たないので、駅と駅の間でしか言えない（#186）
        const where = d.position
          ? (d.position.to ? `${d.position.from}〜${d.position.to}` : `${d.position.from}に停車中`)
          : null;
        const body = [
          el("span", { class: "t", text: d.time }),
          el("span", { class: "what" }, [d.type, d.destination].filter(Boolean).join(" "),
            where ? el("small", { text: `いま ${where}` }) : null),
          el("span", { class: "left" }, leftText, delayNode(line, d, left)),
        ];
        if (!toggle) return el("div", { class: "dep-row" }, ...body);

        const row = el("button", {
          type: "button",
          class: toggle.open ? "dep-row more open" : "dep-row more",
          "aria-expanded": String(toggle.open),
        }, ...body, el("span", { class: "chev", "aria-hidden": "true" }));
        row.addEventListener("click", () => {
          if (state.openDir.has(toggle.key)) state.openDir.delete(toggle.key);
          else state.openDir.add(toggle.key);
          renderSelection();
        });
        return row;
      }

      function renderStationPanel(area, operatorId) {
        const station = (area.stations ?? []).find((st) => st.id === operatorId);
        const name = station?.name ?? operatorId;
        const sec = el("section", { class: "panel", "aria-label": `${name}の発車時刻` });
        sec.append(panelHead(`${name}　横浜駅`, "発車時刻を閉じる"));

        if (!trains) {
          sec.append(el("p", { class: "panel-empty", text: trainsError
            ? "発車時刻を取得できませんでした。"
            : "発車時刻を取得中…" }));
          return sec;
        }
        const operator = (trains.operators ?? []).find((op) => op.id === operatorId);
        if (!operator?.lines?.length) {
          sec.append(el("p", { class: "panel-empty", text: `${name}の時刻表を取得できませんでした。` }));
          return sec;
        }

        const now = nowMinutes();
        for (const line of operator.lines) {
          sec.append(el("div", { class: "line-head" }, el("span", { text: line.name }), lineInfoNode(line)));
          for (const direction of line.directions) {
            sec.append(el("div", { class: "dir-head", text: direction.name }));
            if (!direction.departures.length) {
              sec.append(el("p", { class: "panel-empty", text: "本日の運行は終了しました。" }));
              continue;
            }
            // 既定では次の1本だけ。JR は4路線×2方向あり、3本ずつ出すと縦に長すぎる（#186）。
            // 1本目を押すと残りが開く
            const key = `${line.id}:${direction.id}`;
            const open = state.openDir.has(key);
            const rest = direction.departures.slice(1);
            direction.departures.forEach((d, i) => {
              if (i > 0 && !open) return;
              const row = departureRow(line, d, now, i === 0 && rest.length ? { key, open } : null);
              sec.append(row);
            });
          }
        }

        // 遅れの可否は便ごとに出すようにしたので（#200）、足は操作の案内と取得時刻だけにする
        const fetched = trains.fetchedAt ? new Date(trains.fetchedAt) : null;
        sec.append(el("p", { class: "panel-foot" },
          "発車時刻をタップで後続列車を表示",
          fetched && !isNaN(fetched) ? `　／　${trains.date} のダイヤ（${hhmm(fetched)} 取得）` : `　／　${trains.date} のダイヤ`,
          reportButton("　／　この時刻を報告", "wrong-time", () => reportContext())));
        return sec;
      }

      // ---- 報告・お問い合わせ（#204）----
      //
      // はまこく Exp.（#122）と同じ受け口へ送る。連投の制限と1日の上限は共通。
      // REPORT_ENABLED=false のときは口が空の一覧を返すので、入口ごと出さない。
      // 展示モードでは触らせないので出さない
      const REPORT_KINDS_API = "api/report-kinds";
      const REPORT_API = "api/report";
      let reportKinds = [];

      async function loadReportKinds() {
        if (KIOSK) return [];
        try {
          const res = await fetch(REPORT_KINDS_API, { cache: "no-store" });
          if (!res.ok) return [];
          reportKinds = (await res.json()).kinds ?? [];
        } catch {
          reportKinds = [];
        }
        return reportKinds;
      }

      /** 報告を開けるか。口が無い配信や、止めているときは開けない */
      function reportAvailable() {
        return reportKinds.length > 0;
      }

      /**
       * 報告の欄を開く（#204）
       * @param {string} kind - 既定で選んでおく種類
       * @param {string} context - 何を見ていたか。そのまま conditions として送る
       */
      function openReport(kind, context) {
        if (!reportAvailable()) return;
        const dialog = document.getElementById("report-dialog");
        const select = document.getElementById("report-kind");
        select.textContent = "";
        for (const k of reportKinds) select.append(el("option", { value: k.value, text: k.label }));
        select.value = reportKinds.some((k) => k.value === kind) ? kind : reportKinds[reportKinds.length - 1].value;
        document.getElementById("report-message").value = "";
        document.getElementById("report-honeypot").value = "";
        const ctx = document.getElementById("report-context");
        ctx.hidden = !context;
        ctx.textContent = context ? `報告対象：${context}` : "";
        ctx.dataset.context = context ?? "";
        const err = document.getElementById("report-error");
        err.hidden = true;
        err.textContent = "";
        dialog.showModal();
      }

      /**
       * いま何を見ていたか（#204）。報告の conditions として送る。
       * エリアと、欄を開いているならその中身を書く
       */
      function reportContext() {
        const area = areaById.get(state.area);
        const parts = [AREA_TAB[area.id] ?? area.name];
        const sel = state.sel;
        if (sel?.kind === "stop") parts.push(`バス停「${sel.id}」の発車時刻`);
        else if (sel?.kind === "station") parts.push(`${(area.stations ?? []).find((st) => st.id === sel.id)?.name ?? sel.id}の発車時刻`);
        else if (sel?.kind === "bus") parts.push("走っているバスの欄");
        else if (sel?.kind === "dep") parts.push(`出発地「${DEPARTURE_NAME[sel.id] ?? sel.id}」`);
        else parts.push("ポート一覧");
        parts.push(`使うアプリ: ${state.op === "both" ? "両方" : operatorLabel(state.op)}`);
        return parts.join(" ／ ");
      }

      /** 報告を開くボタン。入口は欄の足・免責・ページの下の3か所（#204） */
      function reportButton(label, kind, context) {
        if (!reportAvailable()) return null;
        return el("button", { type: "button", class: "report-open", text: label,
          onclick: () => openReport(kind, typeof context === "function" ? context() : context) });
      }

      async function sendReport() {
        const err = document.getElementById("report-error");
        const send = document.getElementById("report-send");
        const message = document.getElementById("report-message").value.trim();
        if (!message) {
          err.hidden = false;
          err.textContent = "内容を入力してください。";
          return;
        }
        send.disabled = true;
        try {
          const res = await fetch(REPORT_API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              kind: document.getElementById("report-kind").value,
              message,
              conditions: document.getElementById("report-context").dataset.context ?? "",
              page: window.location.pathname,
              // 罠の欄。人が触ることは無いので、入っていたら機械とみなされる
              website: document.getElementById("report-honeypot").value,
            }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok || !body.ok) throw new Error(body.error || "送信に失敗しました。時間をおいて再度お試しください。");
          document.getElementById("report-dialog").close();
          noteSent();
        } catch (error) {
          err.hidden = false;
          err.textContent = error.message;
        } finally {
          send.disabled = false;
        }
      }

      /** 送れたことを知らせる。欄の上に短く出すだけ（画面を塞がない） */
      function noteSent() {
        const note = el("p", { class: "panel-empty", role: "status", text: "送信しました。ご協力ありがとうございます。" });
        const panels = document.getElementById("panels");
        panels.prepend(note);
        setTimeout(() => note.remove(), 6000);
      }

      // ---- 走っているバス（#84）とその欄（#178）----
      //
      // 位置は ODPT の本番 API にしか無く、キーが要るのでサーバ経由でしか取れない。
      // 静的に配っているとき（file:// や Live Server）は口が無いので、バスの表示ごと畳む。
      // 出るのは横浜市営バスだけ（相鉄バスは車両位置を配信していない）
      const BUSES_API = "api/buses";
      // odpt:Bus の odpt:frequency が 30 秒。サーバのキャッシュも同じ
      const BUS_REFRESH_MS = 30 * 1000;
      let busTimer = null;
      let busFetching = false;
      let busLastFetchedAt = 0;
      // 口が無い・キーが無いと分かったら、以後は取りに行かない
      let busAvailable = true;
      const busesByArea = {};

      function busTitle(bus) {
        return [
          bus.route ? `${bus.route}系統` : "市営バス",
          bus.terminal ? `${bus.terminal}行` : null,
          bus.delay > 0 ? `${bus.delay}分遅れ` : bus.delay === 0 ? "定刻" : null,
          bus.occupancy,
        ].filter(Boolean).join("・");
      }

      function renderBuses(area) {
        const u = ui.get(area.id);
        // 同じ車両は作り直さずに使い回す。展示モードで前の位置から滑らせるため（#187）
        const prev = new Map(u.buses.map((b) => [b.bus.id, b]));
        const next = [];
        for (const bus of busesByArea[area.id] ?? []) {
          const { x, y } = project(bus, area);
          const kept = prev.get(bus.id);
          if (kept) {
            prev.delete(bus.id);
            kept.node.title = busTitle(bus);
            kept.node.setAttribute("aria-label", busTitle(bus));
            const dir = kept.node.querySelector(".dir");
            if (dir && bus.azimuth !== null && bus.azimuth !== undefined) dir.style.transform = `rotate(${Math.round(bus.azimuth)}deg)`;
            const route = kept.node.querySelector(".route");
            if (route) route.textContent = bus.route ?? "";
            if (KIOSK) {
              // 経路の形があれば線に沿って、無ければ2点を直線で（#187・#189）
              const via = routeBetween(bus.route, { lat: kept.bus.lat, lon: kept.bus.lon }, { lat: bus.lat, lon: bus.lon });
              const points = via ? via.map((q) => project(q, area)) : [{ x: kept.x, y: kept.y }, { x, y }];
              kept.path = makePath(points);
              // 経路に沿っているときだけ、矢印を動きに合わせる（#189）。直線に落ちたときは
              // 2 点を結んだだけで実際の進む向きとは限らないので、odpt:azimuth のままにする
              kept.path.snapped = Boolean(via);
              kept.at = performance.now();
            } else { kept.x = x; kept.y = y; }
            kept.bus = bus;   // path を作るのに前の位置が要るので、作り終えてから差し替える
            next.push(kept);
            continue;
          }
          const node = el("button", { type: "button", class: "bus", "aria-label": busTitle(bus), title: busTitle(bus) });
          if (bus.azimuth !== null && bus.azimuth !== undefined) {
            node.insertAdjacentHTML("beforeend", BUS_DIR);
            node.lastElementChild.style.transform = `rotate(${Math.round(bus.azimuth)}deg)`;
          }
          const body = el("span", { class: "body" });
          body.innerHTML = BUS_GLYPH;
          node.append(body);
          if (bus.route) node.append(el("span", { class: "route", text: bus.route }));
          node.addEventListener("click", () => select({ kind: "bus", area: area.id, id: bus.id }));
          u.markers.appendChild(node);
          next.push({ node, x, y, bus });
        }
        // 範囲から出た車両は消す
        for (const b of prev.values()) b.node.remove();
        u.buses = next;
        positionMarkers(area.id);
      }

      // 系統ごとの経路の形（#189）。GTFS から焼いたものをサーバが配る。
      // 取れなければ空のままで、バスは2点を直線で結んで動く
      const SHAPES_API = "api/busShapes";
      let busShapes = {};

      async function loadBusShapes() {
        if (location.protocol === "file:") return;
        try {
          const res = await fetch(SHAPES_API, { cache: "default" });
          if (!res.ok) return;
          busShapes = (await res.json()).routes ?? {};
        } catch { /* 無ければ直線で動かす */ }
      }

      /**
       * 経路の線の上で、ある地点にいちばん近いところを探す（#189）。
       * @returns {{line:number[][], i:number, t:number, d:number}|null} - i 番目の区間の t（0〜1）の位置
       */
      function nearestOnLine(lines, lat, lon) {
        let best = null;
        for (const line of lines) {
          for (let i = 0; i < line.length - 1; i += 1) {
            const [alat, alon] = line[i];
            const [blat, blon] = line[i + 1];
            // 緯度経度のままだと経度が詰まるので、経度に cos を掛けて正方形に近づける
            const k = Math.cos(alat * Math.PI / 180);
            const vx = (blon - alon) * k;
            const vy = blat - alat;
            const wx = (lon - alon) * k;
            const wy = lat - alat;
            const len2 = vx * vx + vy * vy;
            const t = len2 > 0 ? clamp((wx * vx + wy * vy) / len2, 0, 1) : 0;
            const dx = wx - vx * t;
            const dy = wy - vy * t;
            const d = Math.hypot(dx, dy);
            if (!best || d < best.d) best = { line, i, t, d };
          }
        }
        return best;
      }

      // 経路の上に乗っているとみなす距離（度）。だいたい 60m
      const SNAP_MAX_DEG = 0.0006;

      /**
       * 2 地点の間を、経路の線に沿った点の列にする（#189）。
       * どちらかが経路から離れていたら null を返し、呼び出し側は直線で動かす
       */
      function routeBetween(route, from, to) {
        const lines = busShapes[route];
        if (!lines) return null;
        const a = nearestOnLine(lines, from.lat, from.lon);
        const b = nearestOnLine(lines, to.lat, to.lon);
        // 同じ線の上で、進む向きに並んでいるときだけ使う。
        // 乗り場で折り返す経路などは線が分かれるので、別の線にまたがったら諦める
        if (!a || !b || a.line !== b.line || a.d > SNAP_MAX_DEG || b.d > SNAP_MAX_DEG) return null;
        const ai = a.i + a.t;
        const bi = b.i + b.t;
        if (bi <= ai) return null;
        const at = (idx) => {
          const i = Math.min(Math.floor(idx), a.line.length - 2);
          const t = idx - i;
          const [la1, lo1] = a.line[i];
          const [la2, lo2] = a.line[i + 1];
          return { lat: la1 + (la2 - la1) * t, lon: lo1 + (lo2 - lo1) * t };
        };
        const pts = [at(ai)];
        for (let i = Math.ceil(ai); i < bi; i += 1) pts.push({ lat: a.line[i][0], lon: a.line[i][1] });
        pts.push(at(bi));
        return pts;
      }

      // 展示モード: バスの位置は 30 秒ごとにしか来ないので、そのままだと 30 秒ごとに瞬間移動する。
      // 前の位置から新しい位置へ、その 30 秒をかけて動かす。見えている位置は最大 30 秒ぶん
      // 遅れることになるが、止まって見えないほうを取る（#187）。
      // 経路の形（#189）があるときは、その線に沿って動かす。無ければ2点を直線で結ぶ
      function glideBuses(now) {
        for (const [, u] of ui) {
          let moved = false;
          for (const b of u.buses) {
            if (!b.path) continue;
            const t = Math.min(1, (now - b.at) / BUS_REFRESH_MS);
            const p = alongPath(b.path, t);
            // 経路に沿って動いている間は、矢印も実際に進んでいる向きに合わせる。
            // odpt:azimuth はその時点の向きなので、曲がっている途中だと動きとずれる（#189）
            const heading = b.path.snapped ? headingOnPath(b.path, t) : null;
            if (heading !== null) {
              const dir = b.node.querySelector(".dir");
              if (dir) dir.style.transform = `rotate(${heading.toFixed(0)}deg)`;
            }
            b.x = p.x;
            b.y = p.y;
            moved = true;
            if (t >= 1) b.path = null;
          }
          if (moved) {
            for (const b of u.buses) placeMarker(b.node, u.view, b.x, b.y);
            // 動いているものに付けた輪は、一緒に動かす
            for (const ping of u.pings) placeMarker(ping.node, u.view, ping.of.x, ping.of.y);
          }
        }
        requestAnimationFrame(glideBuses);
      }

      /** 点の列（地図の座標）の、全体の t（0〜1）の位置 */
      function alongPath(path, t) {
        const total = path.total;
        if (!(total > 0)) return path.points[0];
        let want = total * t;
        for (let i = 0; i < path.points.length - 1; i += 1) {
          const seg = path.lengths[i];
          if (want <= seg || i === path.points.length - 2) {
            const r = seg > 0 ? want / seg : 0;
            const a = path.points[i];
            const c = path.points[i + 1];
            return { x: a.x + (c.x - a.x) * r, y: a.y + (c.y - a.y) * r };
          }
          want -= seg;
        }
        return path.points[path.points.length - 1];
      }

      /**
       * 点の列の、全体の t（0〜1）のところで進んでいる向き（#189）。
       * 地図は 1px = 1m の正射なので、画面の向き＝実際の方位。0 が北で時計回り
       */
      function headingOnPath(path, t) {
        if (!(path.total > 0)) return null;
        let want = path.total * t;
        for (let i = 0; i < path.points.length - 1; i += 1) {
          const seg = path.lengths[i];
          if (want <= seg || i === path.points.length - 2) {
            const a = path.points[i];
            const b = path.points[i + 1];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            if (dx === 0 && dy === 0) return null;
            // y は下向きが南なので、北を 0 にするには -dy を使う
            return (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
          }
          want -= seg;
        }
        return null;
      }

      /** 地図の座標の点の列から、区間ごとの長さを数えておく（毎フレーム数えないため） */
      function makePath(points) {
        const lengths = [];
        let total = 0;
        for (let i = 0; i < points.length - 1; i += 1) {
          const d = Math.hypot(points[i + 1].x - points[i].x, points[i + 1].y - points[i].y);
          lengths.push(d);
          total += d;
        }
        return { points, lengths, total };
      }

      function renderBusPanel(bus) {
        const sec = el("section", { class: "panel", "aria-label": "選んだバス" });
        sec.append(panelHead([bus.route ? `${bus.route}系統` : "市営バス", bus.terminal ? `${bus.terminal}行` : null].filter(Boolean).join("　"), "バスの情報を閉じる"));
        sec.append(el("div", { class: "panel-meta" },
          el("span", { text: "市営バス" }),
          bus.delay > 0 ? el("span", { class: "late", text: `${bus.delay}分遅れ` })
            : bus.delay === 0 ? el("span", { style: "font-weight: 700", text: "定刻" })
              : el("span", { class: "muted", text: "遅れは分かりません" }),
          bus.occupancy ? el("span", { class: "muted", text: bus.occupancy }) : null));

        if (bus.stops && bus.stops.length) {
          for (const st of bus.stops) {
            const note = st.kind === "next" ? "次に止まる" : st.kind === "terminal" ? (st.name.includes("横浜駅") ? "横浜駅に着く見込み" : "終点") : "";
            // 遅れているときは、時刻表の時刻に赤い二重線を引いて見込みに訂正する（#200）。
            // 「見込みです」と文で書いても見落とされるため
            const corrected = st.expected !== st.time;
            sec.append(el("div", { class: `ride-row ${st.kind}` },
              el("span", { class: "dot" }),
              el("span", { class: "name" }, st.name, note ? el("small", { text: note }) : null),
              el("span", { class: "time" },
                corrected ? el("s", { class: "was", text: st.time }) : null,
                st.expected, el("small", { text: "着" }))));
          }
        } else {
          sec.append(el("p", { class: "panel-empty", text: bus.next ? `次は ${bus.next} に止まります。この先の時刻を取得できませんでした。` : "この先の時刻を取得できませんでした。" }));
        }
        const at = bus.reportedAt ? new Date(bus.reportedAt) : null;
        sec.append(el("p", { class: "panel-foot" },
          at && !isNaN(at) ? `位置は ${hhmm(at)} 時点` : "",
          reportButton(at && !isNaN(at) ? "　／　この位置を報告" : "この位置を報告", "delay", () => reportContext())));
        return sec;
      }

      // バスの位置が取れたかどうか（#198）。台数ではなくこの3つだけを凡例に小さく添える。
      // #84 の「位置が取れないとき・走っていない時間帯を、黙って空にしない」を満たすのが目的
      const BUS_STATUS_LABEL = {
        ok: "取得成功",
        empty: "取得成功（周辺に運行中のバスなし）",
        error: "取得失敗",
      };
      let busStatus = null;
      // 位置の生成時刻（dc:date）のうち、いちばん新しいもの（#220。2.1.1）
      let busReportedAt = null;

      function setBusStatus(status) {
        if (busStatus === status) return;
        busStatus = status;
        renderLegend();
      }

      // 口そのものが無いと分かったときは、バスの層・切り替え・凡例を消す
      function hideBuses() {
        busAvailable = false;
        clearTimeout(busTimer);
        busTimer = null;
        for (const area of data.areas) { busesByArea[area.id] = []; renderBuses(area); }
        busStatus = null;
        busReportedAt = null;
        renderControls();
        renderLegend();
      }

      // 次に取り直すまでのあいだに dct:valid（生成から約 36 秒）を過ぎた位置は、画面から外す（ODPT ガイドライン 2.1.2）。
      // 取得は odpt:frequency（30 秒）より短くできないので、外すことで「古い位置を出さない」を守る
      function dropExpiredBuses() {
        const now = Date.now();
        let changed = false;
        for (const area of data.areas) {
          const list = busesByArea[area.id] ?? [];
          const alive = list.filter((b) => !b.validUntil || !(Date.parse(b.validUntil) < now));
          if (alive.length === list.length) continue;
          busesByArea[area.id] = alive;
          renderBuses(area);
          changed = true;
        }
        if (changed && state.sel && state.sel.kind === "bus") renderSelection();
      }
      setInterval(dropExpiredBuses, 5000);

      async function fetchBuses() {
        if (!busAvailable || busFetching) return;
        // file:// で開いたときは口が無いと分かりきっている。取得エラーではなく、バスの表示ごと畳む
        if (location.protocol === "file:") return hideBuses();
        busFetching = true;
        clearTimeout(busTimer);

        try {
          const res = await fetch(BUSES_API, { cache: "no-store" });
          // 404（静的配信）・503（サーバにキーが無い）は、待っても出ないので畳む
          if (res.status === 404 || res.status === 503) return hideBuses();
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const body = await res.json();
          noteDemo(body);
          busReportedAt = body.reportedAt ?? null;
          for (const area of data.areas) {
            busesByArea[area.id] = (body.areas && body.areas[area.id]) || [];
            renderBuses(area);
          }
          updateBusNote();
          renderLegend();
          // 選んでいたバスが範囲から出たら、欄を閉じる。まだいれば新しい位置と遅れで描き直す
          if (state.sel && state.sel.kind === "bus") renderSelection();
        } catch (error) {
          busReportedAt = null;
          for (const area of data.areas) { busesByArea[area.id] = []; renderBuses(area); }
          setBusStatus("error");
        } finally {
          busFetching = false;
          busLastFetchedAt = Date.now();
          scheduleBuses(BUS_REFRESH_MS);
        }
      }

      function updateBusNote() {
        if (!busAvailable) return;
        setBusStatus((busesByArea[state.area] || []).length ? "ok" : "empty");
      }

      function scheduleBuses(delayMs) {
        clearTimeout(busTimer);
        busTimer = null;
        if (!busAvailable || document.hidden) return;
        busTimer = setTimeout(fetchBuses, delayMs);
      }

      // ---- 台数の取得と自動更新 ----

      function toRealtime(stations, lastUpdated) {
        return { stations: new Map(stations.map((st) => [String(st.station_id), st])), lastUpdated: new Date(lastUpdated * 1000) };
      }

      // サーバから。口そのものが無ければ null を返し、呼び出し側でフィード直読みに切り替える
      // 仮データで表示しているか（#276）。サーバが、台数・バス・時刻表・電車の応答に demo を付けて知らせる。
      // 展示モードでも出す（作り物だと分からないまま見せない）
      function noteDemo(body) {
        if (body && typeof body.demo === "boolean") document.getElementById("demo-banner").hidden = !body.demo;
      }

      async function loadFromServer() {
        let body;
        try {
          const res = await fetch(STATUS_API, { cache: "no-store" });
          if (!res.ok) return null;
          body = await res.json();
          if (!body || !body.operators) return null;
          noteDemo(body);
        } catch (error) {
          return null;
        }
        // 口はある。事業者ごとの失敗はそのまま伝える（ここでフィード直読みに落とすと、
        // サーバ側のキャッシュを素通りして全国分を毎回落としてしまう）
        return Object.keys(STATUS_FEEDS).map((op) => {
          const v = body.operators[op];
          return v && Array.isArray(v.stations)
            ? { status: "fulfilled", value: toRealtime(v.stations, v.lastUpdated) }
            : { status: "rejected", reason: new Error(`${op}: ${(v && v.error) || "応答なし"}`) };
        });
      }

      function loadFromFeeds() {
        return Promise.allSettled(Object.entries(STATUS_FEEDS).map(async ([op, url]) => {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error(`${op}: HTTP ${res.status}`);
          const body = await res.json();
          return toRealtime(body.data.stations, body.last_updated);
        }));
      }

      // 自動更新の間隔。GBFS の ttl もサーバのキャッシュも 60 秒なので、これより短くしても数字は新しくならない
      const REFRESH_INTERVAL_MS = 60 * 1000;
      let refreshTimer = null;
      let lastFetchedAt = 0;
      let fetching = false;

      async function fetchRealtime() {
        if (fetching) return;
        fetching = true;
        clearTimeout(refreshTimer);
        const button = document.getElementById("refresh");
        const status = document.getElementById("rt-status");
        button.disabled = true;

        try {
          const results = (await loadFromServer()) ?? (await loadFromFeeds());
          const failed = [];
          Object.keys(STATUS_FEEDS).forEach((op, i) => {
            const r = results[i];
            if (r.status === "fulfilled") realtime[op] = r.value;
            else { realtime[op] = null; failed.push(op); }
          });
          renderPins();
          renderList();
          // ここに出すのは更新をかけた時刻。データの時点は「くわしく」の表
          status.textContent = `${hhmm(new Date())} 更新（自動で更新）`;
          updatedAtText = status.textContent;
          renderLegend();
          if (failed.length) status.append(el("span", { class: "warn", text: `　${failed.map(operatorLabel).join("・")}の台数を取得できませんでした` }));
          // 時刻の欄を開いていれば、遅れも取り直す
          if (state.sel && state.sel.kind === "stop") loadTimetable(true).then(() => renderSelection());
        } finally {
          button.disabled = false;
          fetching = false;
          lastFetchedAt = Date.now();
          scheduleRefresh(REFRESH_INTERVAL_MS);
        }
      }

      // 画面が見えていないときは予約しない（visibilitychange で再開する）
      function scheduleRefresh(delayMs) {
        clearTimeout(refreshTimer);
        refreshTimer = null;
        if (document.hidden) return;
        refreshTimer = setTimeout(fetchRealtime, delayMs);
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          clearTimeout(refreshTimer); refreshTimer = null;
          clearTimeout(busTimer); busTimer = null;
          return;
        }
        if (!fetching) {
          const elapsed = Date.now() - lastFetchedAt;
          if (elapsed >= REFRESH_INTERVAL_MS) fetchRealtime();
          else scheduleRefresh(REFRESH_INTERVAL_MS - elapsed);
        }
        if (busAvailable && !busFetching) {
          const elapsed = Date.now() - busLastFetchedAt;
          if (elapsed >= BUS_REFRESH_MS) fetchBuses();
          else scheduleBuses(BUS_REFRESH_MS - elapsed);
        }
      });

      // ---- 状態の切り替え ----

      function setArea(id) {
        if (state.area === id) return;
        state.area = id;
        if (state.sel && state.sel.area !== id) state.sel = null;
        applyArea();
        renderControls();
        renderLegend();
        renderList();
        renderSelection();
        updateBusNote();
      }

      function applyArea() {
        for (const [areaId, u] of ui) u.viewport.hidden = areaId !== state.area;
        // 隠していた地図は大きさが 0 なので、出したところで測り直す
        const u = ui.get(state.area);
        u.view.measure();
        // 展示モードの ?zoom= / ?center= は、測り直したあとに掛ける。
        // 隠れている地図は大きさが 0 で全体表示の倍率が出せないため（#187）
        if (KIOSK) applyKioskView(state.area);
        syncZoomButtons();
      }

      /** 設営時に URL で決めた倍率と中央を、そのエリアの地図に当てる（#187） */
      function applyKioskView(areaId) {
        const u = ui.get(areaId);
        const area = areaById.get(areaId);
        if (KIOSK_ZOOM !== 1) { u.view.scale = u.view.fit * KIOSK_ZOOM; u.view.apply(); }
        if (KIOSK_CENTER) {
          const { bbox } = area;
          const inside = KIOSK_CENTER.lat >= bbox.latMin && KIOSK_CENTER.lat <= bbox.latMax
            && KIOSK_CENTER.lon >= bbox.lonMin && KIOSK_CENTER.lon <= bbox.lonMax;
          if (inside) { const { x, y } = project(KIOSK_CENTER, area); u.view.panTo(x, y); }
        }
      }

      function toggleLayer(kind) {
        state.layers[kind] = !state.layers[kind];
        applyLayers();
        // 消した層のものを選んでいたら、欄も閉じる（出所が見えない欄を残さない）
        const kindOf = { stop: "stops", bus: "buses", station: "stations" };
        if (state.sel && kindOf[state.sel.kind] === kind && !state.layers[kind]) state.sel = null;
        renderControls();
        renderSelection();
      }

      function applyLayers() {
        for (const u of ui.values()) {
          for (const k of ["ports", "stops", "buses"]) u.viewport.classList.toggle(`hide-${k}`, !state.layers[k]);
          // 駅はキーが無い配信では機能ごと畳む（#186・#100）
          u.viewport.classList.toggle("hide-stations", !state.layers.stations || !trainsAvailable);
          // 出口はキーも口も要らない（areas.json に書いてある）ので、層の切り替えだけ見る
          u.viewport.classList.toggle("hide-exits", !state.layers.exits);
        }
      }

      function setOp(op) {
        state.op = op;
        saveOp(op);
        renderControls();
        renderPins();
        renderList();
      }

      // 拡大縮小のボタン。いま出ている地図に効く
      function syncZoomButtons() {
        const u = ui.get(state.area);
        if (!u) return;
        const v = u.view;
        const zoom = document.getElementById("map-zoom");
        zoom.querySelector('[data-zoom="out"]').disabled = v.atFit;
        zoom.querySelector('[data-zoom="fit"]').disabled = v.atFit;
        zoom.querySelector('[data-zoom="in"]').disabled = v.scale >= v.fit * MAX_ZOOM_FACTOR * 0.999;
      }
      document.getElementById("map-zoom").addEventListener("click", (e) => {
        const b = e.target.closest("[data-zoom]");
        if (!b) return;
        const v = ui.get(state.area).view;
        if (b.dataset.zoom === "fit") v.reset();
        else v.zoomBy(b.dataset.zoom === "in" ? ZOOM_STEP : 1 / ZOOM_STEP);
      });

      // ---- 展示モード：しばらく触られなかったら最初に戻す（#180）----

      // ---- 展示モード: 自動でめくる（#187）----
      //
      // 来場者には触らせず、出せるものを順に選んでいく。欄が出るのは
      // バス停・走っているバス・出発地の建物の3種類。中身が無いものは飛ばし、
      // 1エリアを一周したら次のエリアへ移る

      let kioskQueue = [];

      // 1周でめくるバスの上限（#252）。走っているバスは多い時間帯に数十台になり、
      // 全部めくると1つのエリアに数分居続けるので、数台に絞って次のエリアへ移る
      const KIOSK_MAX_BUSES = 5;
      // 車両ごとに最後にめくった順番。同じバスばかり出ないよう、めくっていないものから選ぶ
      const kioskBusSeen = new Map();
      let kioskBusTick = 0;

      function kioskPickBuses(buses) {
        const picked = [...buses]
          .sort((a, b) => (kioskBusSeen.get(a.bus.id) ?? -1) - (kioskBusSeen.get(b.bus.id) ?? -1))
          .slice(0, KIOSK_MAX_BUSES);
        for (const b of picked) kioskBusSeen.set(b.bus.id, kioskBusTick++);
        return picked;
      }

      function kioskTargets(areaId) {
        const area = areaById.get(areaId);
        const u = ui.get(areaId);
        const out = [];
        for (const s of u.stops) {
          // その日の便が無いバス停は飛ばす（常盤祭の土日は構内の便がほとんど無い）
          if ((timetable?.stops?.[s.name] ?? []).length) out.push({ kind: "stop", area: areaId, id: s.name });
        }
        for (const st of u.stations) {
          // キーが無い配信では駅の印ごと出ないので、めくる対象にも入れない
          if (trainsAvailable) out.push({ kind: "station", area: areaId, id: st.id });
        }
        for (const b of kioskPickBuses(u.buses)) out.push({ kind: "bus", area: areaId, id: b.bus.id });
        for (const d of area.departures ?? []) out.push({ kind: "dep", area: areaId, id: d.id });
        return out;
      }

      // 1周ぶんを作り直している最中か（時刻表の読み込みを待つあいだに、次のめくりが来ても重ねない）
      let kioskRefilling = false;

      function kioskStep() {
        if (kioskQueue.length) {
          select(kioskQueue.shift() ?? null);
          return;
        }
        if (kioskRefilling) return;
        kioskRefilling = true;
        // 1周するたびに時刻表を読み直してから、めくる対象を作る（#233）。
        // 「その日の便があるバス停」だけをめくるので、起動時の1回の読み込みに失敗すると
        // 全部のバス停が飛ばされ、バス停を選ばないので読み直すきっかけも無いままになっていた。
        // loadTimetable は 60 秒以内なら読み直さず、日付が変わったら取り直す
        loadTimetable().finally(() => {
          kioskRefilling = false;
          // 一周したら次のエリアへ。エリアが1つしかなければそのまま
          const ids = data.areas.map((a) => a.id);
          const next = ids[(ids.indexOf(state.area) + 1) % ids.length];
          if (next !== state.area) setArea(next);
          // 切り替えた直後は、まず地図を一枚そのまま見せる（null = 何も選ばない）。
          // 対象が少ないエリア（横浜駅はバス停1つ）でも一瞬で通り過ぎないようにする
          kioskQueue = [null, ...kioskTargets(state.area)];
          select(kioskQueue.shift() ?? null);
        });
      }

      // ---- 組み立て ----

      const frame = document.getElementById("map-frame");
      for (const area of data.areas) frame.appendChild(buildMap(area));
      renderControls();
      renderLegend();
      applyLayers();
      applyArea();
      renderPins();
      renderList();
      renderFavorites();
      // 覚えている停留所があるなら、開いた時点で次の発車を出す（#146）
      if (state.favorites.length) loadTimetable().finally(renderFavorites);
      for (const u of ui.values()) u.view.measure();

      // ページの下の断り書き（#199）。「くわしく」と同じ組み立てを使い回す。
      // 「こちら」が押せるかは報告の可否で決まるので、関数にして読み直せるようにする（#204）
      function renderSiteDisclaimer() {
        const box = document.getElementById("site-disclaimer");
        box.textContent = "";
        box.append(...disclaimerParts(
          "本ページの情報は公共交通事業者より提供されたデータを元に表示していますが、",
          strongText("必ずしも正確・完全なものとは限りません。")));
      }
      renderSiteDisclaimer();

      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.sel) closePanel(); });
      document.getElementById("refresh").addEventListener("click", () => { fetchRealtime(); fetchBuses(); });
      fetchRealtime();
      fetchBuses();
      // 報告の受け口（#204）。止めていたら空で返るので、入口ごと出さない。
      // 先に読んでから一覧と免責を描き直す（「こちら」が押せるかが決まるため）
      loadReportKinds().finally(() => { renderList(); renderSiteDisclaimer(); });

      // ダイアログの操作
      document.getElementById("report-send").addEventListener("click", sendReport);
      for (const id of ["report-cancel"]) document.getElementById(id).addEventListener("click", () => document.getElementById("report-dialog").close());
      document.querySelector("#report-dialog .panel-head .x").addEventListener("click", () => document.getElementById("report-dialog").close());

      // 駅の発車時刻（#186）。503 なら駅の印ごと畳むので、開いた時点で一度読む
      loadTrains().finally(() => {
        if (!trainsAvailable && state.sel?.kind === "station") state.sel = null;
        renderControls();
        renderLegend();
        applyLayers();
        renderSelection();
      });

      if (KIOSK) {
        // 設営でプロジェクタに合わせる（いま出ているエリアに当てる。ほかは出たときに applyArea が当てる）
        applyKioskView(state.area);
        // バス停の時刻表は、めくる前に読んでおく（中身の無い停留所を飛ばす判定に要る）
        Promise.all([loadTimetable(), loadTrains()]).finally(() => { kioskStep(); setInterval(kioskStep, KIOSK_STEP_MS); });
        // 経路の形を読んでおく。読めなくてもバスは直線で動く（#189）
        loadBusShapes();
        requestAnimationFrame(glideBuses);
      }
    })();
  </script>
    <!-- 報告・お問い合わせ（#204）。はまこく Exp. と同じ受け口へ送る。
         REPORT_ENABLED=false のときは /api/report-kinds が空を返すので、入口ごと出さない -->
    <dialog id="report-dialog" class="report-dialog" aria-labelledby="report-title">
      <form method="dialog" id="report-form">
        <div class="panel-head">
          <h2 id="report-title">team301 に報告する</h2>
          <button type="button" class="x" value="cancel" aria-label="閉じる">×</button>
        </div>
        <div class="report-body">
          <p class="report-lead">交通事業者へのお問い合わせはご遠慮ください。氏名・連絡先の記入は不要です。</p>
          <label class="report-field">
            <span>種類</span>
            <select id="report-kind"></select>
          </label>
          <label class="report-field">
            <span>内容</span>
            <textarea id="report-message" rows="4" maxlength="1000" placeholder="お気づきの点をご記入ください"></textarea>
          </label>
          <p class="report-context" id="report-context" hidden></p>
          <!-- 人には見えない罠の欄（config/report.js の REPORT_HONEYPOT と同じ名前にすること） -->
          <input type="text" id="report-honeypot" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <p class="report-error" id="report-error" hidden></p>
        </div>
        <div class="report-actions">
          <button type="button" class="btn" value="cancel" id="report-cancel">キャンセル</button>
          <button type="button" class="btn send" id="report-send">送信</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
